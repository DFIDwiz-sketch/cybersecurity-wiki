<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Arkime session to verified export</title>
  <desc id="desc">Identify the indexed session, confirm packet availability, export as a capture file, and verify the resulting records and scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bae6fd"/>
    </marker>
  </defs>
  <rect width="540" height="370" rx="16" fill="#0f172a"/>
  <g stroke="#bae6fd" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 80v24"/>
    <path d="M270 172v24"/>
    <path d="M270 264v24"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="512" height="66" rx="9" fill="#1e293b" stroke="#456983"/>
    <text x="28" y="41" font-size="22" font-weight="700" fill="#f0f9ff">1. Indexed session</text>
    <text x="28" y="65" font-size="17" fill="#bae6fd">Time, endpoints, protocol and capture node</text>
    <rect x="14" y="106" width="512" height="66" rx="9" fill="#1e293b" stroke="#456983"/>
    <text x="28" y="133" font-size="22" font-weight="700" fill="#f0f9ff">2. Retained packets</text>
    <text x="28" y="157" font-size="17" fill="#bae6fd">Check source storage, permissions and retention</text>
    <rect x="14" y="198" width="512" height="66" rx="9" fill="#1e293b" stroke="#456983"/>
    <text x="28" y="225" font-size="22" font-weight="700" fill="#f0f9ff">3. Capture export</text>
    <text x="28" y="249" font-size="17" fill="#bae6fd">Choose a supported format and verify selection scope</text>
    <rect x="14" y="290" width="512" height="66" rx="9" fill="#1e293b" stroke="#456983"/>
    <text x="28" y="317" font-size="22" font-weight="700" fill="#f0f9ff">4. File verification</text>
    <text x="28" y="341" font-size="17" fill="#bae6fd">Read records, compare lengths and preserve SHA-256</text>
  </g>
</svg>
