<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" role="img" aria-labelledby="title desc">
  <title id="title">관리 ID를 조사할 때 보는 증거</title>
  <desc id="desc">ID 연결과 인증, 리소스 작업을 주체 식별자로 대조합니다. 서비스 요청 ID로 작업과 워크로드 기록을 연결합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="540" height="370" rx="16" fill="#0f172a"/>
  <g stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 80v24"/>
    <path d="M270 172v24"/>
    <path d="M270 264v24"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="512" height="66" rx="9" fill="#1e293b" stroke="#536391"/>
    <text x="28" y="41" font-size="22" font-weight="700" fill="#eef2ff">Azure ID 연결</text>
    <text x="28" y="65" font-size="17" fill="#c7d2fe">워크로드 리소스 ID, 테넌트, 주체</text>
    <rect x="14" y="106" width="512" height="66" rx="9" fill="#1e293b" stroke="#536391"/>
    <text x="28" y="133" font-size="22" font-weight="700" fill="#eef2ff">Entra 로그인</text>
    <text x="28" y="157" font-size="17" fill="#c7d2fe">호출 주체, 대상 API, 로그인 결과</text>
    <rect x="14" y="198" width="512" height="66" rx="9" fill="#1e293b" stroke="#536391"/>
    <text x="28" y="225" font-size="22" font-weight="700" fill="#eef2ff">대상 리소스 작업</text>
    <text x="28" y="249" font-size="17" fill="#c7d2fe">리소스 ID, 요청 ID, 인가 결과</text>
    <rect x="14" y="290" width="512" height="66" rx="9" fill="#1e293b" stroke="#536391"/>
    <text x="28" y="317" font-size="22" font-weight="700" fill="#eef2ff">워크로드 요청 기록</text>
    <text x="28" y="341" font-size="17" fill="#c7d2fe">서비스 요청 ID로 실제 호출 위치 대조</text>
  </g>
</svg>
