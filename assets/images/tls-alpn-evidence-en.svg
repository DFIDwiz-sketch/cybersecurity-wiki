<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Independent ALPN on two TLS connections</title>
  <desc id="desc">The client offers h2 and http/1.1 to the TLS edge and selects h2 with it. The edge opens separate TLS to the origin and negotiates http/1.1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5f3fc"/>
    </marker>
  </defs>
  <rect width="540" height="330" rx="16" fill="#0f172a"/>
  <g font-family="system-ui, sans-serif">
    <g fill="#1e293b" stroke="#406477">
      <rect x="18" y="18" width="504" height="52" rx="9"/>
      <rect x="18" y="139" width="504" height="52" rx="9"/>
      <rect x="18" y="260" width="504" height="52" rx="9"/>
    </g>
    <g fill="#ecfeff" font-size="22" font-weight="700">
      <text x="32" y="51">Client</text>
      <text x="32" y="172">Edge proxy terminates TLS</text>
      <text x="32" y="293">Origin</text>
    </g>
    <g stroke="#a5f3fc" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M42 81v47"/>
      <path d="M42 202v47"/>
    </g>
    <g fill="#a5f3fc" font-size="17">
      <text x="62" y="102">Client offers h2 and http/1.1</text>
      <text x="62" y="125">Edge selects h2 on this leg</text>
      <text x="62" y="223">Edge offers http/1.1 on a new connection</text>
      <text x="62" y="246">Origin selects http/1.1 on that leg</text>
    </g>
  </g>
</svg>
