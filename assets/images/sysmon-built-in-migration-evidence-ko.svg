<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Sysmon 전환을 단계별로 검증하기</title>
  <desc id="desc">기준 상태와 승인 변경을 기록합니다. 로컬 XML, 수집기 전달본, SIEM 필드에서 같은 프로세스 카나리를 확인합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bfdbfe"/>
    </marker>
  </defs>
  <rect width="540" height="370" rx="16" fill="#0f172a"/>
  <g stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 80v24"/>
    <path d="M270 172v24"/>
    <path d="M270 264v24"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="41" font-size="22" font-weight="700" fill="#eff6ff">1. 기준 상태와 변경 기록</text>
    <text x="28" y="65" font-size="17" fill="#bfdbfe">Windows 빌드, 설치 형태, 승인된 정책</text>
    <rect x="14" y="106" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="133" font-size="22" font-weight="700" fill="#eff6ff">2. 로컬 Sysmon 이벤트 XML</text>
    <text x="28" y="157" font-size="17" fill="#bfdbfe">공급자, 원본 호스트, Event ID 1과 표식</text>
    <rect x="14" y="198" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="225" font-size="22" font-weight="700" fill="#eff6ff">3. 수신기 또는 수집기</text>
    <text x="28" y="249" font-size="17" fill="#bfdbfe">원본 이벤트의 프로세스 GUID와 표식 비교</text>
    <rect x="14" y="290" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="317" font-size="22" font-weight="700" fill="#eff6ff">4. SIEM에 들어간 증거</text>
    <text x="28" y="341" font-size="17" fill="#bfdbfe">정규화 필드 값을 원본 이벤트와 비교</text>
  </g>
</svg>
