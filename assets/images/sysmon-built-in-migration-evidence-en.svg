<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Sysmon migration verification by stage</title>
  <desc id="desc">Record the baseline and authorized change. Find the process canary in local XML, then in the collector copy, then in indexed fields.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bfdbfe"/>
    </marker>
  </defs>
  <rect width="540" height="370" rx="16" fill="#0f172a"/>
  <g stroke="#bfdbfe" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 80v24"/>
    <path d="M270 172v24"/>
    <path d="M270 264v24"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="41" font-size="22" font-weight="700" fill="#eff6ff">1. Baseline and change record</text>
    <text x="28" y="65" font-size="17" fill="#bfdbfe">Windows build, installed variant and approved policy</text>
    <rect x="14" y="106" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="133" font-size="22" font-weight="700" fill="#eff6ff">2. Local Sysmon event XML</text>
    <text x="28" y="157" font-size="17" fill="#bfdbfe">Provider, source host, Event ID 1 and canary fields</text>
    <rect x="14" y="198" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="225" font-size="22" font-weight="700" fill="#eff6ff">3. Receiver or collector</text>
    <text x="28" y="249" font-size="17" fill="#bfdbfe">Match process GUID and marker in source event data</text>
    <rect x="14" y="290" width="512" height="66" rx="9" fill="#1e293b" stroke="#517092"/>
    <text x="28" y="317" font-size="22" font-weight="700" fill="#eff6ff">4. Indexed SIEM evidence</text>
    <text x="28" y="341" font-size="17" fill="#bfdbfe">Compare typed fields with the original event</text>
  </g>
</svg>
