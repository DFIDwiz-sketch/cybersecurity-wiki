<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="title desc" lang="en">
 <title id="title">Investigate VLAN Tags and Sensor Visibility</title><desc id="desc">Untagged ingress is classified as VLAN 20. A tagged trunk view and a sensor copy can differ.</desc>
 <rect width="440" height="340" rx="14" fill="#0f172a"/>
 <path d="M220 94v25m-4-5 4 5 4-5 M220 198v19h-105v27m-4-5 4 5 4-5 M220 217h105v27m-4-5 4 5 4-5" fill="none" stroke="#93c5fd" stroke-width="2"/>
 <g font-family="system-ui, sans-serif">
  <rect x="75" y="16" width="290" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
  <text x="87" y="46" font-size="18" font-weight="700" fill="#f8fafc">Access link</text>
  <text x="87" y="71" font-size="14" fill="#dbeafe">Untagged frame</text>
  <rect x="75" y="120" width="290" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
  <text x="87" y="150" font-size="18" font-weight="700" fill="#f8fafc">Switch classification</text>
  <text x="87" y="175" font-size="14" fill="#dbeafe">Ingress port assigns VLAN 20</text>
  <rect x="16" y="245" width="198" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
  <text x="28" y="275" font-size="18" font-weight="700" fill="#f8fafc">Trunk observation</text>
  <text x="28" y="300" font-size="14" fill="#dbeafe">C-tag VID 20</text>
  <rect x="226" y="245" width="198" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
  <text x="238" y="275" font-size="18" font-weight="700" fill="#f8fafc">Sensor copy</text>
  <text x="238" y="300" font-size="14" fill="#dbeafe">Verify tag preservation</text>
 </g>
</svg>
