<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">HTTP/2 연결과 요청 경로</title><desc id="desc">첫 연결의 SNI는 alpha입니다. alpha 요청은 200, beta 요청은 421입니다. 새 연결에서 beta SNI로 재시도하면 200을 받습니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0 8 4 0 8z" fill="#52738c"/></marker></defs>
  <rect width="480" height="320" rx="16" fill="#eef5fb"/>
  <g fill="none" stroke="#52738c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 61v23H118v20"/><path d="M240 61v23h122v20"/>
    <path d="M362 150v27H240v21" stroke-dasharray="5 3"/><path d="M240 242v18"/>
  </g>
  <g stroke="#52738c" stroke-width="1.5">
    <rect x="79" y="17" width="322" height="44" rx="8" fill="#dceafb"/>
    <rect x="18" y="105" width="200" height="45" rx="8" fill="#dff2e7"/>
    <rect x="262" y="105" width="200" height="45" rx="8" fill="#ffe9da"/>
    <rect x="79" y="199" width="322" height="43" rx="8" fill="#dceafb"/>
    <rect x="79" y="261" width="322" height="42" rx="8" fill="#dff2e7"/>
  </g>
  <g text-anchor="middle" fill="#1b3043" font-family="system-ui, sans-serif" font-size="18">
    <text x="240" y="45">연결 1 · SNI alpha · h2</text><text x="118" y="134">스트림 1 · alpha · 200</text><text x="362" y="134">스트림 3 · beta · 421</text><text x="240" y="227">연결 2 · SNI beta · h2</text><text x="240" y="289">스트림 1 · beta · 200</text>
  </g>
</svg>
