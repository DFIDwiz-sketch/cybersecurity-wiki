<svg xmlns="http://www.w3.org/2000/svg" width="480" height="496" viewBox="0 0 480 496" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Kubernetes probe decisions</title>
  <desc id="desc">Startup success enables the other two probes. Readiness updates endpoint eligibility. Startup or liveness failures at the threshold stop the container, and restart policy applies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#314763"/>
    </marker>
    <marker id="stop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b3d22"/>
    </marker>
  </defs>
  <rect width="480" height="496" rx="18" fill="#f5f8fe"/>
  <g fill="#e7eefc" stroke="#2a4675" stroke-width="2">
    <rect x="125" y="24" width="206" height="68" rx="10"/>
    <rect x="19" y="184" width="202" height="68" rx="10"/>
    <rect x="238" y="184" width="202" height="68" rx="10"/>
    <rect x="19" y="340" width="202" height="112" rx="10"/>
  </g>
  <rect x="238" y="340" width="202" height="112" rx="10" fill="#fff0e8" stroke="#9b3d22" stroke-width="2"/>
  <g fill="none" stroke="#314763" stroke-width="2.5">
    <path d="M228 92 V151 H120 V179" marker-end="url(#arrow)"/>
    <path d="M228 151 H339 V179" marker-end="url(#arrow)"/>
    <path d="M120 252 V335" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#9b3d22" stroke-width="2.5" stroke-dasharray="6 5">
    <path d="M331 58 H459 V396 H444" marker-end="url(#stop-arrow)"/>
    <path d="M339 252 V335" marker-end="url(#stop-arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#172642" text-anchor="middle">
    <text x="228" y="65">Startup probe</text>
    <text x="120" y="225">Readiness probe</text>
    <text x="339" y="225">Liveness probe</text>
    <text x="120" y="389">Pod and endpoint</text>
    <text x="120" y="417">conditions update</text>
    <text x="339" y="389">Stop container</text>
    <text x="339" y="417">Apply restart policy</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <rect x="125" y="106" width="206" height="29" rx="5" fill="#f5f8fe"/>
    <text x="228" y="127" fill="#314763">startup succeeds</text>
    <rect x="24" y="281" width="192" height="30" rx="5" fill="#f5f8fe"/>
    <text x="120" y="302" fill="#314763">readiness result</text>
    <rect x="243" y="281" width="192" height="30" rx="5" fill="#f5f8fe"/>
    <text x="339" y="302" fill="#822e1a">failure threshold</text>
    <text x="388" y="48" fill="#822e1a" font-size="16">failure threshold</text>
  </g>
</svg>
