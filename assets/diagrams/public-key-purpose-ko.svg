<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="title desc"><title id="title">암호화와 서명의 키 방향</title><desc id="desc">기밀성: Bob에게 비밀 전달. Alice → Bob 공개키로 암호화. Bob → Bob 개인키로 복호화. 서명: Alice 키와 내용 관계 확인. Alice 개인키로 원문 서명. Bob이 Alice 공개키로 검증. 서명은 원문을 숨기지 않습니다. 공개키 신뢰는 별도 확인합니다.</desc><rect width="760" height="475" rx="16" fill="#101c30"/><g font-family="Arial, sans-serif" fill="#eaf2ff"><text x="30" y="40" font-size="23">암호화와 서명의 키 방향</text><text x="30" y="80" fill="#71ddd0" font-size="20">기밀성: Bob에게 비밀 전달</text><rect x="30" y="100" width="700" height="48" rx="8" fill="#203752"/><text x="45" y="131" font-size="20">Alice → Bob 공개키로 암호화</text><text x="375" y="174" font-size="24">↓</text><rect x="30" y="185" width="700" height="48" rx="8" fill="#203752"/><text x="45" y="216" font-size="20">Bob → Bob 개인키로 복호화</text><text x="30" y="260" fill="#71ddd0" font-size="20">서명: Alice 키와 내용 관계 확인</text><rect x="30" y="280" width="700" height="48" rx="8" fill="#203752"/><text x="45" y="311" font-size="20">Alice 개인키로 원문 서명</text><text x="375" y="354" font-size="24">↓</text><rect x="30" y="365" width="700" height="48" rx="8" fill="#203752"/><text x="45" y="396" font-size="20">Bob이 Alice 공개키로 검증</text><text x="30" y="445" font-size="17">서명은 원문을 숨기지 않습니다. 공개키 신뢰는 별도 확인합니다.</text></g></svg>