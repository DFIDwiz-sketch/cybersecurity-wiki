<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326" width="560" height="326" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Separate the service invocations</title>
  <desc id="desc">Keep A and B separate and confirm delivery on the receiver.</desc>
  <style>text{fill:#eefbf8;font:16px system-ui,sans-serif;text-anchor:middle}.label{font-size:18px;font-weight:700}.detail{fill:#bfdae2;font-size:14px}</style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#84dfcc"/></marker></defs>
  <rect width="560" height="326" rx="15" fill="#0c1821"/>
  <rect x="105" y="21" width="350" height="48" rx="10" fill="#142d39" stroke="#74c8b9"/>
  <text x="280" y="51" class="label">reports.service · same unit name</text>
  <rect x="24" y="108" width="246" height="128" rx="10" fill="#142d39" stroke="#74c8b9"/>
  <text x="147" y="135" class="label">Invocation A</text>
  <text x="147" y="159" class="detail">08:01 UTC · First run</text>
  <text x="147" y="188">Manager · exit status 1</text>
  <text x="147" y="214">Service · API timeout</text>
  <rect x="290" y="108" width="246" height="128" rx="10" fill="#142d39" stroke="#74c8b9"/>
  <text x="413" y="135" class="label">Invocation B</text>
  <text x="413" y="159" class="detail">08:02 UTC · Restart</text>
  <text x="413" y="188">Manager · new run started</text>
  <text x="413" y="214">Service · reported sending R-417</text>
  <rect x="185" y="269" width="351" height="37" rx="10" fill="#142d39" stroke="#74c8b9"/>
  <text x="360" y="293">Receiver · R-417 acceptance recorded</text>
  <g fill="none" stroke="#84dfcc" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 70V87H147V104"/>
    <path d="M375 70V87H413V104"/>
    <path d="M413 237V265" stroke-dasharray="4 4"/>
  </g>
</svg>
