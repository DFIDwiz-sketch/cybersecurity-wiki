<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">같은 PID, 서로 다른 프로세스</title><desc id="desc">WS01의 A 종료 후 PID 4100이 재사용되며 WS02는 별도 호스트입니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">같은 PID, 서로 다른 프로세스</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01: 프로세스 A</text><text x="14" y="63" font-size="16" fill="#edf4ff">04:01 ~ 04:02</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0001</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01: 프로세스 B</text><text x="14" y="63" font-size="16" fill="#edf4ff">04:05 ~ 04:10</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0002</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS02: 프로세스 C</text><text x="14" y="63" font-size="16" fill="#edf4ff">04:06 생성</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0003</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">연결 범위</text><text x="14" y="63" font-size="16" fill="#edf4ff">출발 엔드포인트 + GUID</text><text x="14" y="89" font-size="16" fill="#edf4ff">시각 + 원본 필드 확인</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">PID·이미지 이름만으로 이 수명을 합치지 마세요. GUID는 가상입니다.</text></g></svg>
