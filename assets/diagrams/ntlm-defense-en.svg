<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" role="img" aria-label="Reduce NTLM risk with layered defenses"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#72dcbd" stroke-width="1.5"/></marker></defs><style>.ttl{font:bold 24px Arial,'Noto Sans KR',sans-serif;fill:#f4f8fc}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5c5d4}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc;text-anchor:middle}.small{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.arrow{stroke:#72dcbd;stroke-width:2.5;fill:none;marker-end:url(#a)}.line{stroke:#72dcbd;stroke-width:2;fill:none}.warn{fill:#ffd180;font:13px Arial,'Noto Sans KR',sans-serif;text-anchor:middle}.dim{font:13px Arial,'Noto Sans KR',sans-serif;fill:#aab8c9;text-anchor:middle}</style><rect x="0" y="0" width="980" height="415" rx="18" fill="#0d1828"/><text x="28" y="38" class="ttl">Reduce NTLM risk with layered defenses</text><text x="28" y="61" class="sub">Audit → inventory dependencies → harden authentication → phase in blocking → monitor</text><rect x="9" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="99" y="160" class="head">Audit NTLM</text><text x="99" y="182" class="small">4624 / 4776 / 800x</text><path class="arrow" d="M190 183 H203"/><rect x="206" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="296" y="160" class="head">Identify dependencies</text><text x="296" y="182" class="small">NAS · apps · services</text><path class="arrow" d="M387 183 H400"/><rect x="403" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="493" y="160" class="head">Repair Kerberos / SPNs</text><text x="493" y="182" class="small">DNS · service accounts</text><path class="arrow" d="M584 183 H597"/><rect x="600" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="690" y="160" class="head">SMB signing / CBT</text><text x="690" y="182" class="small">SMB / LDAPS / HTTP EPA</text><path class="arrow" d="M781 183 H794"/><rect x="797" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#ffd180" stroke-width="1.5"/><text x="887" y="160" class="head">Restrict + detect</text><text x="887" y="182" class="small">Few exceptions + validation</text><text x="490" y="305" class="warn">SMB signing addresses SMB relay; LDAP CBT binds SASL authentication to TLS sessions</text></svg>