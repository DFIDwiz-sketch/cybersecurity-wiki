<svg xmlns="http://www.w3.org/2000/svg" width="360" height="334" viewBox="0 0 360 334" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">NTFS 변경 저널의 조사 순서</title>
  <desc id="desc">저널 ID와 커서를 확인합니다. 기록이 남았으면 파일 변경을 분석하고, 공백이 있으면 다른 자료를 찾습니다. 수행자는 별도 증거로 확인합니다.</desc>
  <rect width="360" height="334" rx="12" fill="#ecf4fc"/>
  <path d="M180 68v19m-5-6 5 6 5-6 M180 149v17H91v12m-5-6 5 6 5-6 M180 166h89v12m-5-6 5 6 5-6 M91 240v20m-5-6 5 6 5-6" fill="none" stroke="#245981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143a57">
    <rect x="16" y="12" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="35" font-size="14" font-weight="700">수집 출처 식별</text>
    <text x="180" y="54" font-size="11">호스트 · 볼륨 · 저널 ID</text>
    <rect x="16" y="91" width="328" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="114" font-size="14" font-weight="700">커서와 범위 비교</text>
    <text x="180" y="133" font-size="11">필요한 위치를 읽을 수 있나요?</text>
    <rect x="8" y="182" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="205" font-size="14" font-weight="700">필요한 기록 있음</text>
    <text x="91" y="224" font-size="11">파일·상위 폴더·이유 대조</text>
    <rect x="186" y="182" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="269" y="205" font-size="14" font-weight="700">공백 또는 ID 변경</text>
    <text x="269" y="224" font-size="11">다른 보존 자료 확인</text>
    <rect x="8" y="264" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="287" font-size="14" font-weight="700">변경 근거 대조</text>
    <text x="91" y="306" font-size="11">감사 로그 또는 단말 자료</text>
  </g>
</svg>
