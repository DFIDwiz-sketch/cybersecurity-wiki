<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" role="img" aria-labelledby="title desc">
  <title id="title">Compare the local journal with central collection</title>
  <desc id="desc">A service sends messages to journald. Local journal files can be read on the host or shipped to a central index.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2e5674"/></marker></defs>
  <rect x="1" y="1" width="438" height="318" rx="16" fill="#f3f8fc" stroke="#aac5db"/>
  <g fill="none" stroke="#2e5674" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M220 59V76"/><path d="M220 114V131"/><path d="M220 170V184H109V212"/><path d="M220 170V184H331V212"/><path d="M331 251V271"/>
  </g>
  <g fill="#dcebf8" stroke="#7b9db8">
    <rect x="116" y="20" width="208" height="37" rx="8"/><rect x="116" y="78" width="208" height="35" rx="8"/><rect x="116" y="133" width="208" height="36" rx="8"/>
    <rect x="26" y="214" width="166" height="35" rx="8"/><rect x="248" y="214" width="166" height="35" rx="8"/><rect x="248" y="273" width="166" height="30" rx="8"/>
  </g>
  <g fill="#143651" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="bold">
    <text x="220" y="45">Service / kernel</text><text x="220" y="102">journald</text><text x="220" y="157">Local journal files</text>
    <text x="109" y="237">Local query</text><text x="331" y="237">Shipper and index</text><text x="331" y="295">Central query</text>
  </g>
</svg>
