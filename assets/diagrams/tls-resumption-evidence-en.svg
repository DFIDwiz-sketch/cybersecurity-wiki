<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 388" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Investigate TLS 1.3 Resumption and 0-RTT</title>
  <desc id="desc">A full handshake supplies a ticket. A new connection offers a PSK, then the observer verifies server selection and the request timing.</desc>
  <rect width="412" height="388" rx="16" fill="#0f172a"/>
  <g font-family="system-ui, sans-serif">
    <rect x="16" y="16" width="380" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
    <circle cx="42" cy="42" r="13" fill="#bfdbfe"/>
    <text x="42" y="48" fill="#172554" font-size="16" text-anchor="middle" font-weight="700">1</text>
    <text x="64" y="48" font-size="20" font-weight="700" fill="#f8fafc">Full TLS handshake</text>
    <text x="64" y="76" font-size="17" fill="#dbeafe">Verify the server certificate</text>
    <path d="M206 94v13m-4 -4 4 4 4 -4" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <rect x="16" y="108" width="380" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
    <circle cx="42" cy="134" r="13" fill="#bfdbfe"/>
    <text x="42" y="140" fill="#172554" font-size="16" text-anchor="middle" font-weight="700">2</text>
    <text x="64" y="140" font-size="20" font-weight="700" fill="#f8fafc">After the handshake</text>
    <text x="64" y="168" font-size="17" fill="#dbeafe">Client receives a session ticket</text>
    <path d="M206 186v13m-4 -4 4 4 4 -4" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <rect x="16" y="200" width="380" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
    <circle cx="42" cy="226" r="13" fill="#bfdbfe"/>
    <text x="42" y="232" fill="#172554" font-size="16" text-anchor="middle" font-weight="700">3</text>
    <text x="64" y="232" font-size="20" font-weight="700" fill="#f8fafc">New TLS connection</text>
    <text x="64" y="260" font-size="17" fill="#dbeafe">Offer PSK; verify server selection</text>
    <path d="M206 278v13m-4 -4 4 4 4 -4" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <rect x="16" y="292" width="380" height="78" rx="10" fill="#172554" stroke="#60a5fa"/>
    <circle cx="42" cy="318" r="13" fill="#bfdbfe"/>
    <text x="42" y="324" fill="#172554" font-size="16" text-anchor="middle" font-weight="700">4</text>
    <text x="64" y="324" font-size="20" font-weight="700" fill="#f8fafc">Application data</text>
    <text x="64" y="352" font-size="17" fill="#dbeafe">Confirm when the request was sent</text>
  </g>
</svg>
