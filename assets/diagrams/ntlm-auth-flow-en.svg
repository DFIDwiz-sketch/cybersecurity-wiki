<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" role="img" aria-label="Normal NTLMv2 challenge-response flow"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#72dcbd" stroke-width="1.5"/></marker></defs><style>.ttl{font:bold 24px Arial,'Noto Sans KR',sans-serif;fill:#f4f8fc}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5c5d4}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc;text-anchor:middle}.small{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.arrow{stroke:#72dcbd;stroke-width:2.5;fill:none;marker-end:url(#a)}.line{stroke:#72dcbd;stroke-width:2;fill:none}.warn{fill:#ffd180;font:13px Arial,'Noto Sans KR',sans-serif;text-anchor:middle}.dim{font:13px Arial,'Noto Sans KR',sans-serif;fill:#aab8c9;text-anchor:middle}</style><rect x="0" y="0" width="980" height="415" rx="18" fill="#0d1828"/><text x="28" y="38" class="ttl">Normal NTLMv2 challenge-response flow</text><text x="28" y="61" class="sub">Domain NTLM validation: client → server → DC using Netlogon secure channel</text><rect x="20" y="101" width="300" height="75" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="170" y="129" class="head">Client</text><text x="170" y="151" class="small">User john</text><path d="M170 176 V370" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="355" y="101" width="300" height="75" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="505" y="129" class="head">Resource server</text><text x="505" y="151" class="small">SMB / HTTP etc.</text><path d="M505 176 V370" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="690" y="101" width="300" height="75" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="840" y="129" class="head">Domain controller</text><text x="840" y="151" class="small">Validates domain secret</text><path d="M840 176 V370" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 6"/><path class="arrow" d="M220 211 H295"/><text class="small" x="257.5" y="201">① NEGOTIATE</text><path class="arrow" d="M295 251 H220"/><text class="small" x="257.5" y="241">② CHALLENGE</text><path class="arrow" d="M220 291 H295"/><text class="small" x="257.5" y="281">③ AUTHENTICATE</text><path class="arrow" d="M555 331 H630"/><text class="small" x="592.5" y="321">④ Netlogon validation</text><path class="arrow" d="M630 370 H555"/><text class="small" x="592.5" y="360">⑤ Authentication result</text><text x="490" y="399" class="warn">Neither the plaintext password nor NT hash is sent over SMB/HTTP as the response</text></svg>