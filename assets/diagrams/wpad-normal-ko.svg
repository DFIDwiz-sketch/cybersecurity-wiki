<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" role="img" aria-label="WPAD 정상 동작 흐름도"><style>svg{background:#0f172a;font-family:Arial,'Noto Sans KR',sans-serif}.node{fill:#1e293b;stroke:#64748b;stroke-width:1.5}.danger{stroke:#fb7185}.title{font-size:17px;font-weight:bold;fill:#f8fafc}.sub{font-size:12px;fill:#cbd5e1}.detail{font-size:13px;fill:#e2e8f0;text-anchor:middle}.blue,.red,.green{fill:none;stroke-width:3;stroke-linecap:round}.blue{stroke:#60a5fa}.red{stroke:#fb7185}.green{stroke:#34d399}.dashed{stroke-dasharray:7 7}.foot{font-size:12px;fill:#cbd5e1;text-anchor:middle}</style><path d="M165 61 H195 M345 61 H375 M525 61 H555" class="blue"/><path d="M620 100 V145 H90 V100" class="blue dashed"/><text x="345" y="137" class="detail">PAC 다운로드 및 설정 적용</text><path d="M90 100 V206 H620 V100" class="green"/><text x="355" y="201" class="detail">설정에 따라 프록시 사용</text><rect x="15" y="35" width="150" height="65" rx="9" class="node "/><text x="90" y="61" text-anchor="middle" class="title">사용자 PC</text><text x="90" y="82" text-anchor="middle" class="sub">WPAD 위치 검색</text><rect x="195" y="35" width="150" height="65" rx="9" class="node "/><text x="270" y="61" text-anchor="middle" class="title">DNS / DHCP</text><text x="270" y="82" text-anchor="middle" class="sub">위치 정보 제공</text><rect x="375" y="35" width="150" height="65" rx="9" class="node "/><text x="450" y="61" text-anchor="middle" class="title">WPAD 서버</text><text x="450" y="82" text-anchor="middle" class="sub">PAC 파일 전달</text><rect x="555" y="35" width="130" height="65" rx="9" class="node "/><text x="620" y="61" text-anchor="middle" class="title">회사 프록시</text><text x="620" y="82" text-anchor="middle" class="sub">웹 요청 중계</text><text x="350" y="289" class="foot">WPAD는 프록시가 아니라 프록시 설정을 발견하는 기술입니다.</text></svg>