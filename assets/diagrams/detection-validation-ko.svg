<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" role="img" aria-labelledby="title desc"><title id="title">탐지 규칙 검증 입문 · 로그 생성부터 알림 전달까지</title><desc id="desc">원본 이벤트 생성 → 수집 및 필드 추출 → 시간 창과 규칙 일치 → 억제와 경보 생성 → 시험 수신처로 전달</desc><rect width="400" height="344" rx="12" fill="#15243b"/><g text-anchor="middle" font-family="sans-serif" font-size="18" fill="#f0f7ff"><rect x="24" y="13" width="352" height="46" rx="9" fill="#274563"/><text x="200" y="42">원본 이벤트 생성</text><text x="200" y="77" fill="#83ebd2">↓</text><rect x="24" y="80" width="352" height="46" rx="9" fill="#274563"/><text x="200" y="109">수집 및 필드 추출</text><text x="200" y="144" fill="#83ebd2">↓</text><rect x="24" y="147" width="352" height="46" rx="9" fill="#274563"/><text x="200" y="176">시간 창과 규칙 일치</text><text x="200" y="211" fill="#83ebd2">↓</text><rect x="24" y="214" width="352" height="46" rx="9" fill="#274563"/><text x="200" y="243">억제와 경보 생성</text><text x="200" y="278" fill="#83ebd2">↓</text><rect x="24" y="281" width="352" height="46" rx="9" fill="#274563"/><text x="200" y="310">시험 수신처로 전달</text></g></svg>