<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Sysmon: validate the whole evidence pipeline</title><desc id="desc">Generation, transport, parsing and investigation can each fail independently.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Sysmon: validate the whole evidence pipeline</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. Endpoint</text><text x="14" y="63" font-size="16" fill="#edf4ff">Build + effective policy</text><text x="14" y="89" font-size="16" fill="#edf4ff">Local event + source time</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. Collection</text><text x="14" y="63" font-size="16" fill="#edf4ff">Channel + forwarding</text><text x="14" y="89" font-size="16" fill="#edf4ff">Retention + transport</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. Parsing</text><text x="14" y="63" font-size="16" fill="#edf4ff">Source host + identifiers</text><text x="14" y="89" font-size="16" fill="#edf4ff">Time + field fidelity</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. Investigation</text><text x="14" y="63" font-size="16" fill="#edf4ff">Process instance + context</text><text x="14" y="89" font-size="16" fill="#edf4ff">Evidence + uncertainty</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">An installed agent does not prove coverage, delivery or a supported conclusion.</text></g></svg>
