<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3: combine separate jobs</title><desc id="desc">1. Ephemeral key shares → secret material. 2. Certificate checks + server handshake signature. 3. Key derivation + Finished checks. 4. Symmetric AEAD → application records. Certificate key ≠ ephemeral agreement key. Conceptual full certificate handshake; PSK and message detail omitted</desc><rect width="760" height="505" rx="16" fill="#101c30"/><g font-family="Arial, sans-serif" fill="#eaf2ff"><text x="30" y="40" font-size="24">TLS 1.3: combine separate jobs</text><rect x="30" y="65" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="100" font-size="21">1. Ephemeral key shares → secret material</text><text x="375" y="144" font-size="23">↓</text><rect x="30" y="150" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="185" font-size="21">2. Certificate checks + server handshake signature</text><text x="375" y="229" font-size="23">↓</text><rect x="30" y="235" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="270" font-size="21">3. Key derivation + Finished checks</text><text x="375" y="314" font-size="23">↓</text><rect x="30" y="320" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="355" font-size="21">4. Symmetric AEAD → application records</text><text x="30" y="440" font-size="20" fill="#71ddd0">Certificate key ≠ ephemeral agreement key</text><text x="30" y="475" font-size="16">Conceptual full certificate handshake; PSK and message detail omitted</text></g></svg>