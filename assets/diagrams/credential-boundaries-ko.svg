<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows 자격 증명 보호: 실제 경계 확인</title><desc id="desc">PPL·Credential Guard·ASR은 범위가 다르며 다른 저장소는 별도 보호가 필요합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows 자격 증명 보호: 실제 경계 확인</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">LSA 보호 / PPL</text><text x="14" y="63" font-size="16" fill="#edf4ff">보호된 LSASS 경계</text><text x="14" y="89" font-size="16" fill="#edf4ff">플러그인 요건</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">Credential Guard</text><text x="14" y="63" font-size="16" fill="#edf4ff">지원 도메인 비밀</text><text x="14" y="89" font-size="16" fill="#edf4ff">VBS 격리</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">LSASS ASR 규칙</text><text x="14" y="63" font-size="16" fill="#edf4ff">메모리 접근 작업</text><text x="14" y="89" font-size="16" fill="#edf4ff">적용 여부 확인</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">별도 표면</text><text x="14" y="63" font-size="16" fill="#edf4ff">SAM / AD DB</text><text x="14" y="89" font-size="16" fill="#edf4ff">앱 비밀</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">설정됨 ≠ 실행 중   |   프로세스 접근 ≠ 자격 증명 추출</text></g></svg>
