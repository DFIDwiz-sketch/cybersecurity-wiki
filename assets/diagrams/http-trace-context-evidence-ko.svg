<svg xmlns="http://www.w3.org/2000/svg" width="560" height="338" viewBox="0 0 560 338" lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">한 요청에 대한 두 업스트림 시도</title>
  <desc id="desc">게이트웨이가 요청 R17과 내부 트레이스 T17을 만듭니다. 시도 A1은 앱 스팬 B1과 503에, A2는 B2와 200에 연결됩니다. 게이트웨이는 최종 200을 기록합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#96e1d0"/>
    </marker>
  </defs>
  <rect width="560" height="338" rx="14" fill="#111e30"/>
  <g fill="#1b3048" stroke="#96e1d0" stroke-width="1.5">
    <rect x="110" y="16" width="340" height="46" rx="9"/>
    <rect x="105" y="85" width="350" height="56" rx="9"/>
    <rect x="21" y="166" width="244" height="60" rx="9"/>
    <rect x="295" y="166" width="244" height="60" rx="9"/>
    <rect x="105" y="254" width="350" height="64" rx="9"/>
  </g>
  <g fill="none" stroke="#96e1d0" stroke-width="2" marker-end="url(#arrow)">
    <path d="M280 62V82"/>
    <path d="M219 141L146 163"/>
    <path d="M341 141L414 163"/>
    <path d="M145 226L215 251"/>
    <path d="M415 226L345 251"/>
  </g>
  <g fill="#f2f7fc" text-anchor="middle" font-family="system-ui, sans-serif">
    <g font-size="18" font-weight="700">
      <text x="280" y="45">클라이언트 요청 도착</text>
      <text x="280" y="110">게이트웨이가 요청 수신</text>
      <text x="143" y="191">시도 1 · reports-a</text>
      <text x="417" y="191">재시도 · reports-b</text>
      <text x="280" y="280">게이트웨이는 최종 200 기록</text>
    </g>
    <g font-size="15">
      <text x="280" y="131">R17 발급, 내부 트레이스 T17 시작</text>
      <text x="143" y="212">A1 → B1, 앱은 503 기록</text>
      <text x="417" y="212">A2 → B2, 앱은 200 기록</text>
      <text x="280" y="301">각 시도와 최종 응답의 근거는 별도 기록에 남습니다</text>
    </g>
  </g>
</svg>
