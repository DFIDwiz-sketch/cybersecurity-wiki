<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="322" viewBox="0 0 1000 322" role="img" aria-label="DFIR 탐지: 세 가지 신호 결합"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#93c5fd" stroke-width="1.5"/></marker><marker id="warningArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#fbbf24" stroke-width="1.5"/></marker></defs><rect width="1000" height="322" fill="#101a2e" rx="16"/><text x="32" y="40" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#f8fafc">DFIR 탐지: 세 가지 신호 결합</text><text x="32" y="64" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#a9bdd8">4769는 서비스 티켓 요청 증거이며 비밀번호 복구 성공 증거가 아닙니다</text><rect x="24" y="96" width="292" height="142" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="170" y="130" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="650" font-size="17" fill="#f8fafc">Windows Security 4769</text><text x="170" y="165" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">RC4 0x17 / AES</text><text x="170" y="200" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">요청 계정, 대상, IP</text><path d="M319 168 L346 168" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="354" y="96" width="292" height="142" rx="12" fill="#1e2d47" stroke="#fbbf24" stroke-width="1.6"/><text x="500" y="130" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="650" font-size="17" fill="#f8fafc">행동 이상 탐지</text><text x="500" y="165" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">짧은 시간 다수 대상</text><text x="500" y="200" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">새 출발지 / 평소와 다른 SPN</text><path d="M649 168 L676 168" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="684" y="96" width="292" height="142" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="830" y="130" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="650" font-size="17" fill="#f8fafc">연관 분석과 대응</text><text x="830" y="165" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">4624, 4648, 4672</text><text x="830" y="200" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="14" fill="#b8cbe5">프로세스 / LDAP / 네트워크</text><text x="166" y="279" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="14" fill="#93c5fd">DC의 4769 기록</text><text x="500" y="279" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="14" fill="#fbbf24">오프라인 크래킹은 관측 공백</text><text x="834" y="279" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">침해 확정 전 교차 검증</text></svg>