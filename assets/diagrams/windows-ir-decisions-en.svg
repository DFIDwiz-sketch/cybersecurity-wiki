<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Response decisions: evidence, action and recovery gates</title><desc id="desc">Requests, completed actions and recovery acceptance are different claims.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Response decisions: evidence, action and recovery gates</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. Assess + preserve</text><text x="14" y="63" font-size="16" fill="#edf4ff">Evidence IDs + unknowns</text><text x="14" y="89" font-size="16" fill="#edf4ff">Scope hosts + identities</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. Request containment</text><text x="14" y="63" font-size="16" fill="#edf4ff">Owner + intended scope</text><text x="14" y="89" font-size="16" fill="#edf4ff">Record pending work</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. Verify enforcement</text><text x="14" y="63" font-size="16" fill="#edf4ff">Endpoint acknowledgment</text><text x="14" y="89" font-size="16" fill="#edf4ff">Check permitted paths</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. Recovery gate</text><text x="14" y="63" font-size="16" fill="#edf4ff">Integrity + identity actions</text><text x="14" y="89" font-size="16" fill="#edf4ff">Telemetry + owner approval</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">06:09 request ≠ 06:20 acknowledgment. Task deletion alone does not close the case.</text></g></svg>
