<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 358" role="img" aria-labelledby="t d"><title id="t">Linux 인증 로그로 조사하기 · SSH, PAM, sudo</title><desc id="d">SSH 연결 · 원격 주소. SSH 인증 수락. PAM 등 세션 단계. sudo 정책 결정. 실행 결과 · 별도 로그. 승인된 SSH 세션이 sudo를 요청할 때 모을 수 있는 관측의 예입니다.</desc><rect width="430" height="358" rx="14" fill="#15243b"/><g font-family="sans-serif" text-anchor="middle" font-size="17" fill="#f0f7ff"><rect x="18" y="12" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="40">SSH 연결 · 원격 주소</text><text x="215" y="78" fill="#83ebd2">↓</text><rect x="18" y="83" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="111">SSH 인증 수락</text><text x="215" y="149" fill="#83ebd2">↓</text><rect x="18" y="154" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="182">PAM 등 세션 단계</text><text x="215" y="220" fill="#83ebd2">↓</text><rect x="18" y="225" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="253">sudo 정책 결정</text><text x="215" y="291" fill="#83ebd2">↓</text><rect x="18" y="296" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="324">실행 결과 · 별도 로그</text></g></svg>