<svg xmlns="http://www.w3.org/2000/svg" width="360" height="334" viewBox="0 0 360 334" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Investigating an NTFS journal</title>
  <desc id="desc">Check the journal identity and cursor. Retained records support file-change analysis. For a gap, recover another source. Corroborate attribution separately.</desc>
  <rect width="360" height="334" rx="12" fill="#ecf4fc"/>
  <path d="M180 68v19m-5-6 5 6 5-6 M180 149v17H91v12m-5-6 5 6 5-6 M180 166h89v12m-5-6 5 6 5-6 M91 240v20m-5-6 5 6 5-6" fill="none" stroke="#245981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143a57">
    <rect x="16" y="12" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="35" font-size="14" font-weight="700">Identify the source</text>
    <text x="180" y="54" font-size="11">Host · volume · journal ID</text>
    <rect x="16" y="91" width="328" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="114" font-size="14" font-weight="700">Compare cursor and bounds</text>
    <text x="180" y="133" font-size="11">Is the needed range readable?</text>
    <rect x="8" y="182" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="205" font-size="14" font-weight="700">Range available</text>
    <text x="91" y="224" font-size="11">Reference, parent, flags</text>
    <rect x="186" y="182" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="269" y="205" font-size="14" font-weight="700">Gap or different ID</text>
    <text x="269" y="224" font-size="11">Find another preserved source</text>
    <rect x="8" y="264" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="287" font-size="14" font-weight="700">Corroborate the change</text>
    <text x="91" y="306" font-size="11">Audit or endpoint evidence</text>
  </g>
</svg>
