<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 518" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Delete marker and retained versions</title>
  <desc id="description">After deletion without a version ID, marker m1 becomes current, and v2 and v1 remain. Current HEAD returns 404 while authorized HEAD of v2 returns 200.</desc>
  <rect width="420" height="518" rx="18" fill="#0f172a"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="380" height="113" rx="12" fill="#172554" stroke="#93c5fd"/>
    <text x="210" y="52" font-size="21" font-weight="700" fill="#eff6ff">Before deletion</text>
    <text x="210" y="83" font-size="19" fill="#dbeafe">v2 · current data version</text>
    <text x="210" y="109" font-size="19" fill="#dbeafe">v1 · older data version</text>
    <path d="M210 139v44m-7-7 7 7 7-7" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="226" y="163" text-anchor="start" font-size="16" fill="#fde68a">Delete without version ID</text>
    <rect x="20" y="193" width="380" height="118" rx="12" fill="#422006" stroke="#fbbf24"/>
    <text x="210" y="226" font-size="21" font-weight="700" fill="#fffbeb">After deletion</text>
    <text x="210" y="256" font-size="19" fill="#fef3c7">m1 · current delete marker</text>
    <text x="210" y="283" font-size="19" fill="#fef3c7">v2 and v1 · retained data</text>
    <path d="M210 312v34H111v36m-7-7 7 7 7-7m92-29h99v36m-7-7 7 7 7-7" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="18" y="388" width="186" height="108" rx="12" fill="#1e293b" stroke="#cbd5e1"/>
    <rect x="216" y="388" width="186" height="108" rx="12" fill="#134e4a" stroke="#5eead4"/>
    <text x="111" y="419" font-size="18" font-weight="700" fill="#f8fafc">Current view</text>
    <text x="111" y="455" font-size="20" fill="#e2e8f0">HEAD 404</text>
    <text x="309" y="419" font-size="18" font-weight="700" fill="#f0fdfa">Version evidence</text>
    <text x="309" y="450" font-size="18" fill="#ccfbf1">List · m1, v2, v1</text>
    <text x="309" y="477" font-size="18" fill="#ccfbf1">v2 HEAD 200</text>
  </g>
</svg>
