<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">The API request and the separate admission call</title>
  <desc id="desc">A client calls Kubernetes. The API server separately calls a webhook. A valid HTTP 200 response can allow or deny. A call failure follows failurePolicy. The API server returns the overall result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#92dfca"/>
    </marker>
  </defs>
  <rect width="560" height="350" rx="14" fill="#111e30"/>
  <g fill="#1c3048" stroke="#92dfca" stroke-width="1.5">
    <rect x="103" y="16" width="354" height="43" rx="9"/>
    <rect x="103" y="81" width="354" height="55" rx="9"/>
    <rect x="20" y="163" width="252" height="73" rx="9"/>
    <rect x="288" y="163" width="252" height="73" rx="9"/>
    <rect x="103" y="268" width="354" height="61" rx="9"/>
  </g>
  <g fill="none" stroke="#92dfca" stroke-width="2" marker-end="url(#arrow)">
    <path d="M280 59V78"/>
    <path d="M222 136L146 160"/>
    <path d="M338 136L414 160"/>
    <path d="M148 236L222 265"/>
    <path d="M412 236L338 265"/>
  </g>
  <g fill="#f3f8fc" text-anchor="middle" font-family="system-ui, sans-serif">
    <g font-size="18" font-weight="700">
      <text x="280" y="43">Client calls the Kubernetes API</text>
      <text x="280" y="105">API server calls a matching webhook</text>
      <text x="146" y="187">Valid webhook response</text>
      <text x="414" y="187">Webhook call failure</text>
      <text x="280" y="293">API server returns final status</text>
    </g>
    <g font-size="15">
      <text x="280" y="124">HTTPS with AdmissionReview</text>
      <text x="146" y="210">HTTP 200 with allowed=true</text><text x="146" y="228">or allowed=false</text>
      <text x="414" y="210">Effective Fail rejects</text><text x="414" y="228">Effective Ignore continues</text>
      <text x="280" y="315">Remaining checks and storage have separate evidence</text>
    </g>
  </g>
</svg>
