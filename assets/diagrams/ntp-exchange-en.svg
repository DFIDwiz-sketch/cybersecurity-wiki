<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 286" role="img" aria-labelledby="title desc" lang="en" width="440" height="286">
  <title id="title">NTP request and reply</title>
  <desc id="desc">T1 and T4 belong to the client clock. T2 and T3 belong to the server clock. The request travels from T1 to T2 and the reply from T3 to T4.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee7c2"/>
    </marker>
  </defs>
  <rect width="440" height="286" rx="18" fill="#111b27"/>
  <g fill="#edf4fa" font-family="system-ui, sans-serif" font-size="19">
    <text x="24" y="39">Client clock</text>
    <text x="416" y="39" text-anchor="end">Server clock</text>
    <text x="24" y="86">T1 · send</text>
    <text x="416" y="127" text-anchor="end">T2 · receive</text>
    <text x="416" y="181" text-anchor="end">T3 · send</text>
    <text x="24" y="223">T4 · receive</text>
  </g>
  <path d="M 152 55 V 250 M 288 55 V 250" stroke="#829bb0" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 152 79 L 288 121 M 288 174 L 152 216" fill="none" stroke="#5ee7c2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g fill="#a3f6e0" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="220" y="84">Request</text>
    <text x="220" y="171">Reply</text>
  </g>
</svg>
