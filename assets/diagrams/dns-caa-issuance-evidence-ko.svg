<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">적용되는 CAA 집합 찾기</title>
  <desc id="desc">이름을 하나씩 조회합니다. 집합이 있으면 평가하고, 비어 있으면 상위 이름을 확인하며, 오류가 나면 별도로 조사합니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4 0 8Z" fill="#475569"/>
  </marker></defs>
  <rect width="440" height="210" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 101v22H75v20"/><path d="M220 101v42"/><path d="M220 101v22h145v20"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="28" font-size="18" font-weight="700">적용되는 CAA 집합 찾기</text>
    <rect x="56" y="44" width="328" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">이름을 조회하고 별칭 확인</text>
    <text x="220" y="89" font-size="14">와일드카드는 기준 이름부터</text>
    <rect x="8" y="147" width="134" height="51" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="75" y="168" font-size="16" font-weight="700">집합 있음</text>
    <text x="75" y="188" font-size="12">발급자 태그 평가</text>
    <rect x="153" y="147" width="134" height="51" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="168" font-size="16" font-weight="700">빈 응답</text>
    <text x="220" y="188" font-size="12">원래 상위 이름 조회</text>
    <rect x="298" y="147" width="134" height="51" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="365" y="168" font-size="16" font-weight="700">조회 오류</text>
    <text x="365" y="188" font-size="12">기록 보존·조사</text>
  </g>
</svg>
