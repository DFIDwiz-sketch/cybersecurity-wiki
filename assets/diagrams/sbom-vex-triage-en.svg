<svg xmlns="http://www.w3.org/2000/svg" width="440" height="308" viewBox="0 0 440 308" role="img" lang="en" aria-labelledby="title desc">
  <title id="title">Evidence for software vulnerability triage</title>
  <desc id="desc">Identify the running artifact, confirm its inventory, check the supplier's scoped statement, and decide what still needs verification.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65e4c6"/></marker></defs>
  <rect width="440" height="308" rx="17" fill="#111b27"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <rect x="35" y="12" width="370" height="54" rx="10" fill="#1d2c3d" stroke="#6e93b0"/>
    <text x="220" y="35" fill="#eff5fb" font-size="19" font-weight="650">Deployed artifact</text>
    <text x="220" y="55" fill="#bbd9ea" font-size="16">Record the digest and platform</text>
    <path d="M220 67 V87" stroke="#65e4c6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="35" y="89" width="370" height="54" rx="10" fill="#1d2c3d" stroke="#6e93b0"/>
    <text x="220" y="112" fill="#eff5fb" font-size="19" font-weight="650">SBOM inventory</text>
    <text x="220" y="132" fill="#bbd9ea" font-size="16">Confirm component and version</text>
    <path d="M220 144 V164" stroke="#65e4c6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="35" y="166" width="370" height="54" rx="10" fill="#1d2c3d" stroke="#6e93b0"/>
    <text x="220" y="189" fill="#eff5fb" font-size="19" font-weight="650">VEX statement</text>
    <text x="220" y="209" fill="#bbd9ea" font-size="16">Check product, finding and issuer</text>
    <path d="M220 221 V241" stroke="#65e4c6" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="35" y="243" width="370" height="54" rx="10" fill="#1d2c3d" stroke="#6e93b0"/>
    <text x="220" y="266" fill="#eff5fb" font-size="19" font-weight="650">Disposition</text>
    <text x="220" y="286" fill="#bbd9ea" font-size="16">Investigate, fix or review an exception</text>
  </g>
</svg>
