<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">출발지·대상·DC 증거 연결</title><desc id="desc">출발 호스트: 프로세스·명시적 자격 증명: 원본 시각·네트워크; 대상 호스트: 로그온·공유·서비스·실행: 호스트 내부 Logon ID; 도메인 컨트롤러: 티켓·자격 증명 검증: 대상 실행을 증명하지 않음</desc><rect width="1000" height="300" rx="20" fill="#101c2d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="42" font-size="25" font-weight="700" fill="#edf5ff">출발지·대상·DC 증거 연결</text><rect x="20" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="32" y="109" font-size="20" font-weight="700" fill="#79ddc3">출발 호스트</text><text x="32" y="146" font-size="16" fill="#eef5ff">프로세스·명시적 자격 증명</text><text x="32" y="176" font-size="15" fill="#bccfe4">원본 시각·네트워크</text><text x="322" y="146" font-size="24" fill="#79ddc3">→</text><rect x="350" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="362" y="109" font-size="20" font-weight="700" fill="#79ddc3">대상 호스트</text><text x="362" y="146" font-size="16" fill="#eef5ff">로그온·공유·서비스·실행</text><text x="362" y="176" font-size="15" fill="#bccfe4">호스트 내부 Logon ID</text><text x="652" y="146" font-size="24" fill="#79ddc3">→</text><rect x="680" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="692" y="109" font-size="20" font-weight="700" fill="#79ddc3">도메인 컨트롤러</text><text x="692" y="146" font-size="16" fill="#eef5ff">티켓·자격 증명 검증</text><text x="692" y="176" font-size="15" fill="#bccfe4">대상 실행을 증명하지 않음</text><text x="24" y="252" font-size="18" fill="#dce9f8">신원 + 호스트 + 시각 + 세션 맥락으로 연결하세요. 다른 호스트의 Logon ID는 전역 키가 아닙니다.</text></g></svg>
