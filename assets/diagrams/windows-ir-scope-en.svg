<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows IR lab: preserve each source boundary</title><desc id="desc">WS01, DC01, FILE01 and APP01 provide distinct evidence rather than a proven attack chain.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows IR lab: preserve each source boundary</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01 / workstation</text><text x="14" y="63" font-size="16" fill="#edf4ff">Process A + DNS/network</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.10</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">DC01 / domain</text><text x="14" y="63" font-size="16" fill="#edf4ff">Service-ticket request</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.30</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">FILE01 / member server</text><text x="14" y="63" font-size="16" fill="#edf4ff">Logon / tasks / processes</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.20</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">APP01 / application</text><text x="14" y="63" font-size="16" fill="#edf4ff">Later network logon</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.40</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">WS02 is a separate host. Similar names, PIDs and session numbers are not global joins.</text></g></svg>
