<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Persistence response: preserve, contain and verify</title><desc id="desc">Scope the mechanism, protect evidence, address active processes and verify recurrence.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Persistence response: preserve, contain and verify</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. Preserve + scope</text><text x="14" y="63" font-size="16" fill="#edf4ff">Host / SID / object path</text><text x="14" y="89" font-size="16" fill="#edf4ff">Definition + target file</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. Reconstruct</text><text x="14" y="63" font-size="16" fill="#edf4ff">Actor / change / trigger</text><text x="14" y="89" font-size="16" fill="#edf4ff">Execution + authorization</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. Contain + repair</text><text x="14" y="63" font-size="16" fill="#edf4ff">Coordinate narrow changes</text><text x="14" y="89" font-size="16" fill="#edf4ff">Process + identity response</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. Validate</text><text x="14" y="63" font-size="16" fill="#edf4ff">Desired state + monitoring</text><text x="14" y="89" font-size="16" fill="#edf4ff">Check re-creation</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">Deleting one registration does not end every process or remove other access paths.</text></g></svg>
