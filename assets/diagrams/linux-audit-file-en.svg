<svg xmlns="http://www.w3.org/2000/svg" width="440" height="408" viewBox="0 0 440 408" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">How Linux Audit file evidence reaches an analyst</title>
  <desc id="description">Audit rule match, daemon delivery, collection and event assembly form distinct evidence stages.</desc>
  <rect width="440" height="408" rx="16" fill="#eff6ff"/>
  <g font-family="system-ui,sans-serif" fill="#12263a">
    <rect x="16" y="16" width="408" height="72" rx="10" fill="#ffffff" stroke="#3c5974"/>
    <text x="32" y="43" font-size="21" font-weight="700">Kernel Audit</text>
    <text x="32" y="71" font-size="18">Rule match creates event records</text>
    <path d="M220 96v19m-5-5 5 5 5-5" fill="none" stroke="#3c5974" stroke-width="2"/>
    <rect x="16" y="122" width="408" height="72" rx="10" fill="#ffffff" stroke="#3c5974"/>
    <text x="32" y="149" font-size="21" font-weight="700">auditd</text>
    <text x="32" y="177" font-size="18">Reads records from the kernel queue</text>
    <path d="M220 202v19m-5-5 5 5 5-5" fill="none" stroke="#3c5974" stroke-width="2"/>
    <rect x="16" y="228" width="408" height="72" rx="10" fill="#ffffff" stroke="#3c5974"/>
    <text x="32" y="255" font-size="21" font-weight="700">Collector</text>
    <text x="32" y="283" font-size="18">Forwards records with source context</text>
    <path d="M220 308v19m-5-5 5 5 5-5" fill="none" stroke="#3c5974" stroke-width="2"/>
    <rect x="16" y="334" width="408" height="72" rx="10" fill="#dcfce7" stroke="#3c5974"/>
    <text x="32" y="361" font-size="21" font-weight="700">Investigation</text>
    <text x="32" y="389" font-size="18">Join SYSCALL, CWD and PATH by event</text>
  </g>
</svg>
