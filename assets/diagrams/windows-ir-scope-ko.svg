<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows 사고 대응: 출처별 경계 보존</title><desc id="desc">서로 다른 호스트의 증거를 완성된 공격 흐름으로 단정하지 않습니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows 사고 대응: 출처별 경계 보존</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01 / 워크스테이션</text><text x="14" y="63" font-size="16" fill="#edf4ff">프로세스 A + DNS/통신</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.10</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">DC01 / 도메인</text><text x="14" y="63" font-size="16" fill="#edf4ff">서비스 티켓 요청</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.30</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">FILE01 / 멤버 서버</text><text x="14" y="63" font-size="16" fill="#edf4ff">로그온 / 작업 / 프로세스</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.20</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">APP01 / 앱 서버</text><text x="14" y="63" font-size="16" fill="#edf4ff">후속 네트워크 로그온</text><text x="14" y="89" font-size="16" fill="#edf4ff">192.0.2.40</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">WS02는 별도 호스트입니다. 이름·PID·세션 숫자는 전역 연결 키가 아닙니다.</text></g></svg>
