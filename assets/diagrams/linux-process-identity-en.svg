<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 298" width="430" height="298" role="img" aria-labelledby="title description" xml:lang="en" font-family="system-ui, sans-serif" text-anchor="middle">
  <title id="title">Compare Linux process observations</title>
  <desc id="description">First compare host, boot and PID view. Then check PID and the process start tick. A mismatch separates observations in that view, while missing fields leave identity unresolved. A complete match is a candidate process instance.</desc>
  <rect width="430" height="298" rx="14" fill="#0e1927"/>
  <g transform="translate(8 12)">
    <rect width="414" height="74" rx="10" fill="#203348" stroke="#a5ccf6" stroke-width="2"/>
    <text x="207" y="29" font-size="20" font-weight="700" fill="#f2f8ff">1. Confirm the observation context</text>
    <text x="207" y="55" font-size="17" fill="#daeafa">Same host, boot and PID view?</text>
  </g>
  <path d="M215 91v15m-5-5 5 5 5-5" fill="none" stroke="#a9d2f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(8 112)">
    <rect width="414" height="74" rx="10" fill="#203348" stroke="#a5ccf6" stroke-width="2"/>
    <text x="207" y="29" font-size="20" font-weight="700" fill="#f2f8ff">2. Compare the process lifetime</text>
    <text x="207" y="55" font-size="17" fill="#daeafa">Same PID and start tick?</text>
  </g>
  <path d="M215 191v15m-5-5 5 5 5-5" fill="none" stroke="#a9d2f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(8 212)">
    <rect width="414" height="74" rx="10" fill="#10443b" stroke="#86efd1" stroke-width="2"/>
    <text x="207" y="29" font-size="20" font-weight="700" fill="#f2f8ff">3. Decide what the evidence supports</text>
    <text x="207" y="55" font-size="17" fill="#daeafa">Match, different key, or still unresolved</text>
  </g>
</svg>
