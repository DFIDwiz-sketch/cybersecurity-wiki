<svg xmlns="http://www.w3.org/2000/svg" width="440" height="324" viewBox="0 0 440 324" role="img" aria-labelledby="title desc">
  <title id="title">DNSSEC validation within one delegation</title>
  <desc id="desc">The resolver uses a trusted parent DS to authenticate a child key, then verifies the child DNSKEY set and the answer.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2d5678"/></marker></defs>
  <rect x="1" y="1" width="438" height="322" rx="15" fill="#f4f8fc" stroke="#abc2d6"/>
  <g fill="#143651" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18">
    <rect x="48" y="20" width="344" height="55" rx="8" fill="#deedf8" stroke="#7799b3"/><text x="220" y="43" font-weight="bold">Authenticated parent DS</text><text x="220" y="63" font-size="15">Digest and key tag</text>
    <path d="M220 76V93" stroke="#2d5678" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="48" y="96" width="344" height="55" rx="8" fill="#deedf8" stroke="#7799b3"/><text x="220" y="119" font-weight="bold">Matching child DNSKEY</text><text x="220" y="139" font-size="15">Compare the full digest</text>
    <path d="M220 152V169" stroke="#2d5678" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="48" y="172" width="344" height="55" rx="8" fill="#deedf8" stroke="#7799b3"/><text x="220" y="195" font-weight="bold">Signed DNSKEY RRset</text><text x="220" y="215" font-size="15">Authenticate the zone keys</text>
    <path d="M220 228V245" stroke="#2d5678" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="48" y="248" width="344" height="55" rx="8" fill="#deedf8" stroke="#7799b3"/><text x="220" y="271" font-weight="bold">Signed answer RRset</text><text x="220" y="291" font-size="15">Verify the signature and time</text>
  </g>
</svg>
