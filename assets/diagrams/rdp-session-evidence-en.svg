<svg xmlns="http://www.w3.org/2000/svg" width="400" height="382" viewBox="0 0 400 382" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">RDP session lifecycle</title>
  <desc id="desc">A remote interactive logon can lead to an active desktop. Disconnect and reconnect can move between active and disconnected states. Logoff can end the session from either state.</desc>
  <rect width="400" height="382" rx="16" fill="#10212d"/>
  <defs>
    <marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0l7 3.5L0 7z" fill="#7de3ce"/>
    </marker>
  </defs>
  <g stroke="#7de3ce" stroke-width="2" fill="none" marker-end="url(#tip)">
    <path d="M120 112v80"/>
    <path d="M264 193v-80"/>
    <path d="M194 255v50"/>
    <path d="M333 81h42v255h-41"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="200" y="33" font-size="21" font-weight="700" fill="#e9f6ff">RDP session lifecycle</text>
    <rect x="56" y="51" width="276" height="60" rx="10" fill="#173244" stroke="#5296ab"/>
    <text x="194" y="76" font-size="19" font-weight="700" fill="#e9f6ff">Active desktop session</text>
    <text x="194" y="98" font-size="16" fill="#c8e0e9">4624 type 10 · initial logon</text>
    <rect x="56" y="194" width="276" height="60" rx="10" fill="#173244" stroke="#5296ab"/>
    <text x="194" y="219" font-size="19" font-weight="700" fill="#e9f6ff">Disconnected desktop</text>
    <text x="194" y="241" font-size="16" fill="#c8e0e9">Session can continue running</text>
    <rect x="56" y="307" width="276" height="60" rx="10" fill="#173244" stroke="#5296ab"/>
    <text x="194" y="332" font-size="19" font-weight="700" fill="#e9f6ff">Logon session ended</text>
    <text x="194" y="354" font-size="16" fill="#c8e0e9">4634 · matching Logon ID</text>
    <text x="120" y="153" font-size="15" fill="#e9f6ff" stroke="#10212d" stroke-width="8" paint-order="stroke">4779 disconnect</text>
    <text x="264" y="153" font-size="15" fill="#e9f6ff" stroke="#10212d" stroke-width="8" paint-order="stroke">4778 reconnect</text>
    <text x="194" y="284" font-size="15" fill="#e9f6ff" stroke="#10212d" stroke-width="8" paint-order="stroke">Logoff</text>
    <text x="375" y="153" font-size="15" fill="#e9f6ff" stroke="#10212d" stroke-width="8" paint-order="stroke" transform="rotate(90 375 153)">Logoff</text>
  </g>
</svg>
