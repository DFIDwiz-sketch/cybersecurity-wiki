<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 375" width="420" height="375" role="img" aria-labelledby="title desc">
  <title id="title">UDP 데이터그램의 증거 지점</title><desc id="desc">로컬에서 송신한 데이터그램을 센서가 볼 수 있습니다. 데이터그램이 수신 소켓에 도착하면 수신 호출의 버퍼 크기에 따라 잘릴 수 있습니다. 앱 처리는 별도 관측입니다.</desc>
  <rect width="420" height="375" rx="18" fill="#122431"/>
  <g fill="#192f40" stroke="#79e1c2" stroke-width="2">
    <rect x="66" y="18" width="288" height="42" rx="9"/>
    <rect x="66" y="87" width="288" height="42" rx="9"/>
    <rect x="66" y="156" width="288" height="42" rx="9"/>
    <rect x="15" y="251" width="188" height="50" rx="9"/>
    <rect x="217" y="251" width="188" height="50" rx="9"/>
    <rect x="51" y="321" width="318" height="38" rx="9" stroke-dasharray="5 4"/>
  </g>
  <g stroke="#79e1c2" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M210 61v21m-4-4 4 4 4-4M210 130v21m-4-4 4 4 4-4M210 199v33H109v13m-4-4 4 4 4-4M210 232h101v13m-4-4 4 4 4-4"/>
  </g>
  <g fill="#f2f8fc" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16">
    <text x="210" y="44">송신 앱 · sendto()</text><text x="210" y="113">네트워크 센서</text>
    <text x="210" y="182">수신 소켓 · recvmsg()</text><text x="127" y="223">버퍼에 맞음</text><text x="298" y="223">버퍼가 작음</text>
    <text x="109" y="281">메시지 전체</text><text x="311" y="281" font-size="15">일부와 MSG_TRUNC</text>
    <text x="210" y="345">별도 증거 · 앱 처리 결과</text>
  </g>
</svg>
