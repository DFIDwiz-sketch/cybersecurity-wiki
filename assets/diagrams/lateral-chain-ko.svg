<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">접근에서 영향까지 구분하기</title><desc id="desc">도달성: 포트·경로가 보임: 권한을 증명하지 않음; 인증: 신원을 확인: 자원 접근과 별개; 권한: 요청 작업 허용: 실제 수행과 별개; 작업: 세션·파일·실행: 결과를 확인; 영향: 업무 결과: 증거로 판단</desc><rect width="1000" height="300" rx="20" fill="#101c2d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="42" font-size="25" font-weight="700" fill="#edf5ff">접근에서 영향까지 구분하기</text><rect x="20" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="32" y="109" font-size="18" font-weight="700" fill="#79ddc3">도달성</text><text x="32" y="146" font-size="16" fill="#eef5ff">포트·경로가 보임</text><text x="32" y="176" font-size="14" fill="#bccfe4">권한을 증명하지 않음</text><text x="202" y="146" font-size="16" fill="#79ddc3">→</text><rect x="215" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="227" y="109" font-size="18" font-weight="700" fill="#79ddc3">인증</text><text x="227" y="146" font-size="16" fill="#eef5ff">신원을 확인</text><text x="227" y="176" font-size="14" fill="#bccfe4">자원 접근과 별개</text><text x="397" y="146" font-size="16" fill="#79ddc3">→</text><rect x="410" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="422" y="109" font-size="18" font-weight="700" fill="#79ddc3">권한</text><text x="422" y="146" font-size="16" fill="#eef5ff">요청 작업 허용</text><text x="422" y="176" font-size="14" fill="#bccfe4">실제 수행과 별개</text><text x="592" y="146" font-size="16" fill="#79ddc3">→</text><rect x="605" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="617" y="109" font-size="18" font-weight="700" fill="#79ddc3">작업</text><text x="617" y="146" font-size="16" fill="#eef5ff">세션·파일·실행</text><text x="617" y="176" font-size="14" fill="#bccfe4">결과를 확인</text><text x="787" y="146" font-size="16" fill="#79ddc3">→</text><rect x="800" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="812" y="109" font-size="18" font-weight="700" fill="#79ddc3">영향</text><text x="812" y="146" font-size="16" fill="#eef5ff">업무 결과</text><text x="812" y="176" font-size="14" fill="#bccfe4">증거로 판단</text><text x="24" y="252" font-size="20" fill="#dce9f8">로그인 성공 ≠ 실행 성공 ≠ 침해 확정</text></g></svg>
