<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 338" width="560" height="338" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">From mail authentication to aggregate evidence</title>
  <desc id="desc">The receiver validates SPF and DKIM, checks the From domain for alignment, and applies DMARC and local policy. Aggregate XML and individual delivery traces answer different questions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#90decb"/>
    </marker>
  </defs>
  <rect width="560" height="338" rx="14" fill="#111d30"/>
  <g fill="#1b3046" stroke="#90decb" stroke-width="1.5">
    <rect x="18" y="17" width="250" height="59" rx="9"/>
    <rect x="292" y="17" width="250" height="59" rx="9"/>
    <rect x="94" y="105" width="372" height="58" rx="9"/>
    <rect x="94" y="187" width="372" height="57" rx="9"/>
    <rect x="18" y="270" width="250" height="54" rx="9"/>
    <rect x="292" y="270" width="250" height="54" rx="9"/>
  </g>
  <g fill="none" stroke="#90decb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M143 76L201 103"/>
    <path d="M417 76L359 103"/>
    <path d="M280 163V184"/>
    <path d="M226 244L145 267"/>
    <path d="M334 244L415 267" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#f0f5fc">
    <g font-size="19" font-weight="700">
      <text x="143" y="42">SPF validation</text><text x="417" y="42">DKIM validation</text>
      <text x="280" y="130">Check From alignment</text><text x="280" y="211">Receiver decision</text>
      <text x="143" y="293">Aggregate XML</text><text x="417" y="293">Message trace</text>
    </g>
    <g font-size="15">
      <text x="143" y="62">Connecting IP and sender domain</text><text x="417" y="62">Signature and signing domain</text>
      <text x="280" y="151">Record which authenticated identity aligns</text><text x="280" y="232">DMARC disposition and local overrides</text>
      <text x="143" y="313">Grouped counts and outcomes</text><text x="417" y="313">Separate delivery evidence</text>
    </g>
  </g>
</svg>
