<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">ELF 파일에서 런타임 증거까지</title>
  <desc id="desc">파일의 ELF 선언, 프로세스의 현재 매핑, 실행 또는 애플리케이션 증거를 각각 비교합니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#475569"/></marker></defs>
  <rect width="440" height="270" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"><path d="M220 100v20"/><path d="M220 179v20"/></g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="28" font-size="18" font-weight="700">ELF 파일에서 런타임 증거까지</text>
    <rect x="35" y="44" width="370" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">디스크 파일</text>
    <text x="220" y="88" font-size="15">선언된 의존성 이름</text>
    <rect x="35" y="123" width="370" height="56" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="220" y="146" font-size="17" font-weight="700">실행 중인 프로세스</text>
    <text x="220" y="167" font-size="15">관측된 매핑과 파일 식별 정보</text>
    <rect x="35" y="202" width="370" height="56" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="220" y="225" font-size="17" font-weight="700">독립 증거</text>
    <text x="220" y="246" font-size="15">실제로 일어난 작업 확인</text>
  </g>
</svg>
