<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">자격 증명 접근 대응: 호스트와 신원 함께 처리</title><desc id="desc">차단·노출 평가·신원 복구·호스트 검증을 별도로 수행합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">자격 증명 접근 대응: 호스트와 신원 함께 처리</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. 보존 + 차단</text><text x="14" y="63" font-size="16" fill="#edf4ff">수행자 / 대상 / 시각</text><text x="14" y="89" font-size="16" fill="#edf4ff">호스트 + 원본 증거</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. 노출 평가</text><text x="14" y="63" font-size="16" fill="#edf4ff">저장소 + 보호 상태</text><text x="14" y="89" font-size="16" fill="#edf4ff">파일 + 계정 범위</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. 신원 대응</text><text x="14" y="63" font-size="16" fill="#edf4ff">신뢰 환경에서 교체/해지</text><text x="14" y="89" font-size="16" fill="#edf4ff">세션 + 의존성</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. 복구 + 검증</text><text x="14" y="63" font-size="16" fill="#edf4ff">초기 침입 + 지속성</text><text x="14" y="89" font-size="16" fill="#edf4ff">보호 통제 + 재발</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">작업 하나의 차단이 전체 차단이나 이미 탈취된 자료의 해지를 뜻하지는 않습니다.</text></g></svg>
