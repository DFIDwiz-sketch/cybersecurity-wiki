<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">Windows 호스트의 프로세스 수명 증거</title>
  <desc id="description">생성과 후속 프로세스 시작, 종료를 비교해 PID 재사용과 구분합니다.</desc>
  <rect width="480" height="400" rx="16" fill="#101b2b"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#81e6d9" stroke-width="2"/></marker></defs>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="46" fill="#a2fff1" font-size="22" font-weight="700">1  08:00 · 생성자 시작</text>
    <text x="32" y="75" fill="#eff6ff" font-size="18">4688: 새 PID 0x410</text>
    <text x="32" y="100" fill="#eff6ff" font-size="18">발생 호스트, 부팅, 실행 파일을 기록합니다.</text>
    <path d="M240 125v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="146" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="178" fill="#a2fff1" font-size="22" font-weight="700">2  08:02 · 자식 프로세스 시작</text>
    <text x="32" y="207" fill="#eff6ff" font-size="18">4688: 기록된 생성자 PID 0x410</text>
    <text x="32" y="232" fill="#eff6ff" font-size="18">새 PID는 0x5b0입니다. 두 세션을 확인합니다.</text>
    <path d="M240 257v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="278" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="310" fill="#a2fff1" font-size="22" font-weight="700">3  08:04 · 자식 프로세스 종료</text>
    <text x="32" y="339" fill="#eff6ff" font-size="18">4689: PID 0x5b0의 종료를 기록합니다.</text>
    <text x="32" y="364" fill="#eff6ff" font-size="18">이후의 0x5b0 시작은 별개의 실행입니다.</text>
  </g>
</svg>
