<svg xmlns="http://www.w3.org/2000/svg" width="440" height="348" viewBox="0 0 440 348" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">템플릿에서 Pod 실행까지</title>
  <desc id="desc">상단에는 워크로드 템플릿과 컨트롤러가 나중에 보내는 요청이 있습니다. 강제 정책이 요청을 거부할 수 있으며, 허용돼 생성된 Pod는 이후 스케줄링과 실행 확인 단계로 이어집니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="440" height="348" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M220 116v27"/>
    <path d="M220 218v16H114v20"/>
    <path d="M220 218v16h106v20"/>
  </g>
  <g stroke-width="1.2">
    <rect x="46" y="44" width="348" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="46" y="146" width="348" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="10" y="256" width="208" height="78" rx="10" fill="#fff1f2" stroke="#be123c"/>
    <rect x="222" y="256" width="208" height="78" rx="10" fill="#ecfdf5" stroke="#047857"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
    <g font-size="18" font-weight="700">
      <text x="220" y="28">템플릿에서 Pod 실행까지</text>
      <text x="220" y="74">Deployment 템플릿</text>
      <text x="220" y="176">컨트롤러가 Pod 생성 요청</text>
      <text x="114" y="283">요청 거부</text>
      <text x="326" y="283">Pod 생성</text>
    </g>
    <g font-size="15">
      <text x="220" y="98">경고·감사에서 위반 표시 가능</text>
      <text x="220" y="200">Pod에 PSA 강제 정책 적용</text>
      <text x="114" y="311">이 요청으로 생성된 Pod 없음</text>
      <text x="326" y="305">스케줄링과</text>
      <text x="326" y="324">컨테이너 상태 확인</text>
    </g>
  </g>
</svg>
