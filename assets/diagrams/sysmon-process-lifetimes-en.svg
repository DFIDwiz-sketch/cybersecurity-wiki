<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Same PID, separate process instances</title><desc id="desc">WS01 reuses PID 4100 after process A exits; WS02 is a separate host.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Same PID, separate process instances</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01: process A</text><text x="14" y="63" font-size="16" fill="#edf4ff">04:01 to 04:02</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0001</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS01: process B</text><text x="14" y="63" font-size="16" fill="#edf4ff">04:05 to 04:10</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0002</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">WS02: process C</text><text x="14" y="63" font-size="16" fill="#edf4ff">Created at 04:06</text><text x="14" y="89" font-size="16" fill="#edf4ff">PID 4100 / GUID ...0003</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">Join boundary</text><text x="14" y="63" font-size="16" fill="#edf4ff">Source endpoint + GUID</text><text x="14" y="89" font-size="16" fill="#edf4ff">Check time + raw fields</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">A PID or image name alone cannot join these lifetimes. GUIDs are fictional.</text></g></svg>
