<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" lang="en" width="440" height="382" viewBox="0 0 440 382">
  <title id="title">IPFIX observation and export stages</title>
  <desc id="desc">The collector decodes data for search when it has the matching template. Without it, data may be held or dropped.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bee0e8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="380" rx="14" fill="#101f2b"/>
  <g fill="none" stroke="#bee0e8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 64 V87"/>
    <path d="M220 130 V153"/>
    <path d="M220 196 V219"/>
    <path d="M220 262 V279 H117 V317"/>
    <path d="M220 262 V279 H323 V317"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#f0f7fc">
    <rect x="53" y="22" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="50" font-size="18">Observe packets at an interface</text>
    <rect x="53" y="88" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="116" font-size="18">Meter and cache flow records</text>
    <rect x="53" y="154" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="182" font-size="18">Export templates and data over UDP</text>
    <rect x="53" y="220" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="248" font-size="18">Collector matches the template</text>
    <text x="89" y="304" font-size="15" fill="#bcf8cd">Template available</text>
    <text x="353" y="304" font-size="15" fill="#ffd5b7">Template missing</text>
    <rect x="19" y="319" width="196" height="42" rx="8" fill="#184338" stroke="#7dc5cf"/>
    <text x="117" y="347" font-size="16">Decode, then index</text>
    <rect x="225" y="319" width="196" height="42" rx="8" fill="#4c3028" stroke="#7dc5cf"/>
    <text x="323" y="347" font-size="16">Hold or drop data</text>
  </g>
</svg>
