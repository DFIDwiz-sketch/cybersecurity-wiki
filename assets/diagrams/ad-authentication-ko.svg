<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="도메인 로그인과 리소스 접근 흐름"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#67d1bb" stroke-width="1.5"/></marker></defs><rect width="1000" height="400" rx="16" fill="#101c29"/><style>.title{font:bold 23px Arial,'Noto Sans KR',sans-serif;fill:#f1f5f9}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f7fcfa;text-anchor:middle}.body{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.small{font:12px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.link{fill:none;stroke:#67d1bb;stroke-width:2.4;marker-end:url(#a)}.plain{fill:none;stroke:#67d1bb;stroke-width:2}.note{font:13px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf;text-anchor:middle}</style><text x="28" y="37" class="title">도메인 로그인과 리소스 접근 흐름</text><text x="28" y="59" class="sub">DNS는 DC를 찾고, KDC는 티켓을 발급하며, 파일 서버는 접근 권한을 검사합니다</text><rect x="22" y="92" width="211" height="75" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="127.5" y="119" class="head">직원 PC</text><text x="127.5" y="141" class="body">john</text><rect x="263" y="92" width="211" height="75" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="368.5" y="119" class="head">DNS · SRV</text><text x="368.5" y="141" class="body">_ldap._tcp...</text><rect x="504" y="92" width="211" height="75" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="609.5" y="119" class="head">DC / KDC</text><text x="609.5" y="141" class="body">AD 계정·그룹</text><rect x="745" y="92" width="231" height="75" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="860.5" y="119" class="head">파일 서버</text><text x="860.5" y="141" class="body">\\fileserver\Finance</text><path class="link" d="M233 131 H261 M474 131 H502"/><path class="plain" d="M610 167 V188 H123 V167"/><path class="plain" d="M610 188 H862 V167"/><text x="500" y="225" class="note">① DC 위치 조회</text><text x="500" y="254" class="note">② Kerberos AS 교환 → TGT</text><text x="500" y="283" class="note">③ TGS 요청 → 서비스 티켓</text><text x="500" y="312" class="note">④ SMB / CIFS 서비스 티켓 제시</text><rect x="58" y="345" width="884" height="31" rx="8" fill="#233745"/><text x="500" y="366" class="note">로그인 성공 ≠ 모든 파일 접근 허용: 서버의 공유/NTFS ACL도 만족해야 합니다</text></svg>