<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" lang="en" width="440" height="330" viewBox="0 0 440 330">
  <title id="title">MTA-STS validation and TLS reporting</title>
  <desc id="desc">The sender checks the effective policy and the candidate MX before SMTP delivery. Failure under enforce blocks that candidate, and a separate reporting path summarizes TLS results.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bee0e8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="328" rx="14" fill="#101f2b"/>
  <g fill="none" stroke="#bee0e8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 64 V87"/>
    <path d="M220 130 V145 H116 V184"/>
    <path d="M220 130 V145 H322 V184"/>
    <path d="M116 228 V256 H155 V275" stroke-dasharray="5 4"/>
    <path d="M322 228 V256 H285 V275" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#f0f7fc">
    <rect x="53" y="22" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="49" font-size="17">Find MX and effective policy</text>
    <rect x="53" y="88" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="115" font-size="17">Match MX and validate TLS</text>
    <text x="63" y="171" font-size="14" fill="#bcf8cd">Checks pass</text>
    <text x="373" y="171" font-size="14" fill="#ffd5b7">Enforce failure</text>
    <rect x="18" y="186" width="196" height="42" rx="8" fill="#184338" stroke="#7dc5cf"/>
    <text x="116" y="213" font-size="15">Continue SMTP attempt</text>
    <rect x="224" y="186" width="196" height="42" rx="8" fill="#4c3028" stroke="#7dc5cf"/>
    <text x="322" y="213" font-size="15">Skip this MX</text>
    <rect x="18" y="277" width="404" height="42" rx="8" fill="#233651" stroke="#7dc5cf"/>
    <text x="220" y="304" font-size="15">Participating sender reports TLS counts</text>
  </g>
</svg>
