<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Authorization with AGDLP"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#67d1bb" stroke-width="1.5"/></marker></defs><rect width="1000" height="400" rx="16" fill="#101c29"/><style>.title{font:bold 23px Arial,'Noto Sans KR',sans-serif;fill:#f1f5f9}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f7fcfa;text-anchor:middle}.body{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.small{font:12px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.link{fill:none;stroke:#67d1bb;stroke-width:2.4;marker-end:url(#a)}.plain{fill:none;stroke:#67d1bb;stroke-width:2}.note{font:13px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf;text-anchor:middle}</style><text x="28" y="37" class="title">Authorization with AGDLP</text><text x="28" y="59" class="sub">Group-based access simplifies administration compared with direct per-user ACL entries</text><rect x="20" y="140" width="212" height="87" rx="11" fill="#1d3344" stroke="#55c9ae" stroke-width="1.8"/><text x="126" y="167" class="head">A: Account</text><text x="126" y="189" class="body">User john</text><path class="link" d="M232 184 H264"/><rect x="268" y="140" width="212" height="87" rx="11" fill="#1d3344" stroke="#55c9ae" stroke-width="1.8"/><text x="374" y="167" class="head">G: Global Group</text><text x="374" y="189" class="body">GG_Finance_Staff</text><path class="link" d="M480 184 H512"/><rect x="516" y="140" width="212" height="87" rx="11" fill="#1d3344" stroke="#55c9ae" stroke-width="1.8"/><text x="622" y="167" class="head">DL: Domain Local</text><text x="622" y="189" class="body">DL_Finance_Modify</text><path class="link" d="M728 184 H760"/><rect x="764" y="140" width="212" height="87" rx="11" fill="#1d3344" stroke="#fbbf24" stroke-width="1.8"/><text x="870" y="167" class="head">P: Permission</text><text x="870" y="189" class="body">Modify Finance share</text><text x="500" y="265" class="note">Effective access depends on group membership, ACLs, deny entries and context</text><text x="500" y="305" class="note">OU placement is not the file permission; ACLs / ACEs apply to resources or directory objects</text></svg>