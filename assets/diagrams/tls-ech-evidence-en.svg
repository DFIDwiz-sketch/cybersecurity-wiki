<svg xmlns="http://www.w3.org/2000/svg" width="440" height="402" viewBox="0 0 440 402" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">ECH discovery and observation</title>
  <desc id="desc">DNS can advertise an ECH configuration. The outer TLS message shows a public name and carries an encrypted inner message. Endpoint and application records establish different outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="440" height="402" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 100v18"/>
    <path d="M220 237v18"/>
    <path d="M220 315v18"/>
  </g>
  <g stroke-width="1.2">
    <rect x="36" y="44" width="368" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="36" y="120" width="368" height="117" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <rect x="65" y="187" width="310" height="35" rx="6" fill="#fffbeb" stroke="#92400e" stroke-dasharray="4 4"/>
    <rect x="36" y="257" width="368" height="58" rx="8" fill="#dcfce7" stroke="#166534"/>
    <rect x="36" y="335" width="368" height="58" rx="8" fill="#dcfce7" stroke="#166534"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
    <g font-size="18" font-weight="700">
      <text x="220" y="29">ECH discovery and observation</text>
      <text x="220" y="67">Discovery</text>
      <text x="220" y="148">Visible on the wire</text>
      <text x="220" y="281">TLS endpoint or client</text>
      <text x="220" y="359">Application</text>
    </g>
    <g font-size="16">
      <text x="220" y="89">DNS HTTPS record may advertise ECH</text>
      <text x="220" y="173">Outer ClientHello · public name</text>
      <text x="220" y="210">Encrypted inner · origin name</text>
      <text x="220" y="303">Evidence of ECH acceptance</text>
      <text x="220" y="381">Matching HTTP request</text>
    </g>
  </g>
</svg>
