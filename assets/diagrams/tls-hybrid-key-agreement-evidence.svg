<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="flow-title flow-desc" xml:lang="en">
  <title id="flow-title">TLS 1.3 hybrid key agreement flow</title>
  <desc id="flow-desc">The client offers groups and shares. If the server requests a new share, the client sends it in a second ClientHello. The two secrets from the hybrid group selected in the final ServerHello feed traffic key derivation. Check certificate validation as well.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#446377"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="438" rx="16" fill="#f5f9fc" stroke="#93a9b6" stroke-width="2"/>
  <g stroke-width="1.5">
    <rect x="20" y="20" width="303" height="62" rx="10" fill="#ddedf8" stroke="#6e97b0"/>
    <rect x="20" y="105" width="303" height="62" rx="10" fill="#fff2d6" stroke="#a38b59" stroke-dasharray="4 3"/>
    <rect x="20" y="190" width="303" height="62" rx="10" fill="#ddedf8" stroke="#6e97b0"/>
    <rect x="20" y="275" width="303" height="62" rx="10" fill="#d9eeee" stroke="#609693"/>
  </g>
  <g fill="none" stroke="#446377" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M323 51 H341 V221 H325"/>
    <path d="M172 82 V104" stroke-dasharray="4 3"/>
    <path d="M172 167 V189" stroke-dasharray="4 3"/>
    <path d="M172 252 V274"/>
    <path d="M172 337 V358"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#123247">
    <g font-size="19" font-weight="700">
      <text x="172" y="45">ClientHello</text>
      <text x="172" y="130">Optional retry for a new share</text>
      <text x="172" y="215">Final ServerHello</text>
      <text x="172" y="300">4588 · X25519MLKEM768</text>
      <text x="172" y="381">Derive TLS traffic keys</text>
    </g>
    <g font-size="16">
      <text x="172" y="68">Supported groups and initial shares</text>
      <text x="172" y="153" font-size="14.5">HelloRetryRequest → second ClientHello</text>
      <text x="172" y="238">Selected group and server share</text>
      <text x="172" y="323">ML-KEM secret + X25519 secret</text>
      <text x="180" y="413" font-size="15">Check certificate and handshake outcome</text>
    </g>
  </g>
</svg>
