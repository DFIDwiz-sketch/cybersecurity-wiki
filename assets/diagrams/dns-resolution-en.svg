<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">DNS cache miss: resolver makes separate queries</title><desc id="desc">The client asks a resolver, which separately queries root, TLD and authoritative servers. Root and TLD do not forward the client query.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#71ddd0"/></marker></defs><rect width="900" height="510" rx="16" fill="#101c30"/><g font-family="Arial,sans-serif" fill="#edf4ff"><text x="25" y="42" font-size="25">DNS cache miss: resolver makes separate queries</text><g stroke="#71ddd0" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M205 250 L300 250"/><path d="M510 225 L650 120"/><path d="M510 250 L650 250"/><path d="M510 275 L650 380"/></g><rect x="30" y="215" width="175" height="70" rx="10" fill="#203752"/><text x="42" y="257" font-size="21">Client</text><rect x="300" y="215" width="210" height="70" rx="10" fill="#203752"/><text x="312" y="257" font-size="21">Recursive resolver</text><rect x="650" y="85" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="127" font-size="21">Root server</text><rect x="650" y="215" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="257" font-size="21">.com TLD</text><rect x="650" y="345" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="387" font-size="21">example.com auth</text><text x="190" y="190" font-size="16">1. Ask / 5. Reply</text><text x="495" y="125" font-size="18">2. Referral</text><text x="520" y="230" font-size="17">3. Referral</text><text x="495" y="385" font-size="18">4. Data answer</text><text x="25" y="475" font-size="21" fill="#71ddd0">Cached data/delegations can avoid upstream queries.</text></g></svg>