<svg xmlns="http://www.w3.org/2000/svg" width="360" height="332" viewBox="0 0 360 332" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Issuance and service evidence</title>
  <desc id="desc">A CA submits a precertificate and the log returns a signed promise. Log inclusion and service deployment then have distinct evidence.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#325977"/></marker></defs>
  <rect x="1" y="1" width="358" height="330" rx="15" fill="#f6f9fd" stroke="#adc6da"/>
  <g fill="none" stroke="#325977" stroke-width="2.4" marker-end="url(#arrow)">
    <path d="M180 59v18"/><path d="M180 136v19H90v17"/><path d="M180 136v19h90v17"/>
    <path d="M90 236v28"/><path d="M270 236v28"/>
  </g>
  <g fill="#e1effa" stroke="#7b9bb4">
    <rect x="23" y="16" width="314" height="43" rx="9"/>
    <rect x="23" y="78" width="314" height="58" rx="9"/>
    <rect x="12" y="173" width="156" height="63" rx="9"/>
    <rect x="192" y="173" width="156" height="63" rx="9"/>
  </g>
  <g fill="#e4f4eb" stroke="#759886">
    <rect x="12" y="265" width="156" height="49" rx="9"/>
    <rect x="192" y="265" width="156" height="49" rx="9"/>
  </g>
  <g fill="#143650" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">
    <text x="180" y="43">CA submits a precertificate</text><text x="180" y="103">Log returns an SCT</text>
    <text x="90" y="200">Log entry</text><text x="270" y="200">Final certificate</text>
    <text x="90" y="295" font-size="15">Monitor checks proof</text><text x="270" y="295" font-size="15">TLS client sees leaf</text>
  </g>
  <g fill="#143650" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">
    <text x="180" y="124">Signed commitment to include</text>
    <text x="90" y="222">Authenticate the root</text><text x="270" y="222">CA issues, owner deploys</text>
  </g>
</svg>
