<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows 지속성: 단계별 증거 확인</title><desc id="desc">등록, 트리거 조건, 실행, 후속 영향은 각각 증거가 필요합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows 지속성: 단계별 증거 확인</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. 등록</text><text x="14" y="63" font-size="16" fill="#edf4ff">Run / 작업 / 서비스 / WMI</text><text x="14" y="89" font-size="16" fill="#edf4ff">현재 상태 + 과거 변경</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. 트리거</text><text x="14" y="63" font-size="16" fill="#edf4ff">로그온 / 일정 / 이벤트</text><text x="14" y="89" font-size="16" fill="#edf4ff">조건 + 실행 계정</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. 실행</text><text x="14" y="63" font-size="16" fill="#edf4ff">프로세스 / 동작 증거</text><text x="14" y="89" font-size="16" fill="#edf4ff">호스트 + 수명 + 맥락</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. 접근 / 영향</text><text x="14" y="63" font-size="16" fill="#edf4ff">파일 / 통신 / 자원</text><text x="14" y="89" font-size="16" fill="#edf4ff">신뢰할 수 있는 연결</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">구성 존재 ≠ 트리거 충족 ≠ 실제 실행 ≠ 악성 영향</text></g></svg>
