<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows credential protection: check the actual boundary</title><desc id="desc">PPL, Credential Guard and ASR have different scopes; other stores need separate protection.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows credential protection: check the actual boundary</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">LSA protection / PPL</text><text x="14" y="63" font-size="16" fill="#edf4ff">Protected LSASS boundary</text><text x="14" y="89" font-size="16" fill="#edf4ff">Plug-in requirements</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">Credential Guard</text><text x="14" y="63" font-size="16" fill="#edf4ff">Supported domain secrets</text><text x="14" y="89" font-size="16" fill="#edf4ff">VBS isolation</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">LSASS ASR rule</text><text x="14" y="63" font-size="16" fill="#edf4ff">Memory-access action</text><text x="14" y="89" font-size="16" fill="#edf4ff">Check applicability</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">Separate surfaces</text><text x="14" y="63" font-size="16" fill="#edf4ff">SAM / AD database</text><text x="14" y="89" font-size="16" fill="#edf4ff">Application secrets</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">Configured ≠ running   |   Process access ≠ credential extraction</text></g></svg>
