<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Service account impersonation</title>
  <desc id="description">An issuance request and the subsequent API request produce separate evidence.</desc>
  <rect width="480" height="400" rx="16" fill="#101b2b"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#81e6d9" stroke-width="2"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="46" fill="#a2fff1" font-size="22" font-weight="700">1  Caller requests a token</text>
    <text x="32" y="76" fill="#eff6ff" font-size="18">IAM Credentials checks the caller’s permission.</text>
    <text x="32" y="101" fill="#eff6ff" font-size="18">Target: the service account in project A</text>
    <path d="M240 125v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="146" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="178" fill="#a2fff1" font-size="22" font-weight="700">2  IAM records the request</text>
    <text x="32" y="208" fill="#eff6ff" font-size="18">Data Access can show requester and target.</text>
    <text x="32" y="233" fill="#eff6ff" font-size="18">Inspect the operation outcome for issuance.</text>
    <path d="M240 257v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="278" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="310" fill="#a2fff1" font-size="22" font-weight="700">3  Resource API receives a token</text>
    <text x="32" y="340" fill="#eff6ff" font-size="18">Project B can record method and outcome.</text>
    <text x="32" y="365" fill="#eff6ff" font-size="18">Delegation may identify the original caller.</text>
  </g>
</svg>
