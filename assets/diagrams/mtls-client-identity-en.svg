<svg xmlns="http://www.w3.org/2000/svg" width="420" height="376" viewBox="0 0 420 376" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Mutual TLS and application authorization</title>
  <desc id="description">The client verifies the service. The TLS terminator verifies the client. The application authorizes the verified principal.</desc>
  <rect width="420" height="376" rx="16" fill="#f1f5f9"/>
  <g font-family="system-ui, sans-serif" fill="#10243a">
    <rect x="16" y="16" width="388" height="98" rx="12" fill="#e0f2fe" stroke="#3d5973"/>
    <text x="31" y="44" font-size="19" font-weight="700">1. Client checks the server</text>
    <text x="31" y="71" font-size="17">Trusted chain, expected service name</text>
    <text x="31" y="94" font-size="17">Server proves possession of its key</text>
    <path d="M210 117v19m-5-5 5 5 5-5" fill="none" stroke="#3d5973" stroke-width="2"/>
    <rect x="16" y="139" width="388" height="98" rx="12" fill="#e0f2fe" stroke="#3d5973"/>
    <text x="31" y="167" font-size="19" font-weight="700">2. Terminator checks the client</text>
    <text x="31" y="194" font-size="17">Client certificate requested and verified</text>
    <text x="31" y="217" font-size="17">Client proves possession of its key</text>
    <path d="M210 240v19m-5-5 5 5 5-5" fill="none" stroke="#3d5973" stroke-width="2"/>
    <rect x="16" y="262" width="388" height="98" rx="12" fill="#dcfce7" stroke="#3d5973"/>
    <text x="31" y="290" font-size="19" font-weight="700">3. Application checks permission</text>
    <text x="31" y="317" font-size="17">Map verified identity to a principal</text>
    <text x="31" y="340" font-size="17">Allow or deny the requested action</text>
  </g>
</svg>
