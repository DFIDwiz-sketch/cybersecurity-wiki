<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">AD CS: enrollment to resource access</title><desc id="desc">Five separate stages; issuance does not prove authentication or authorization.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">AD CS: enrollment to resource access</text><g transform="translate(40,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">1. Client key</text><text x="14" y="62" font-size="15" fill="#edf4ff">Public / private pair</text><text x="14" y="87" font-size="15" fill="#edf4ff">Protect key custody</text></g><g transform="translate(247.2,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">2. Request</text><text x="14" y="62" font-size="15" fill="#edf4ff">Identity + template</text><text x="14" y="87" font-size="15" fill="#edf4ff">Enrollment endpoint</text></g><g transform="translate(454.4,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">3. CA decision</text><text x="14" y="62" font-size="15" fill="#edf4ff">Policy + permissions</text><text x="14" y="87" font-size="15" fill="#edf4ff">Issue / deny / pending</text></g><g transform="translate(661.5999999999999,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">4. Authentication</text><text x="14" y="62" font-size="15" fill="#edf4ff">Key possession</text><text x="14" y="87" font-size="15" fill="#edf4ff">Trust + mapping</text></g><g transform="translate(868.8,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">5. Resource access</text><text x="14" y="62" font-size="15" fill="#edf4ff">Mapped identity</text><text x="14" y="87" font-size="15" fill="#edf4ff">Authorization policy</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">Issued certificate ≠ authenticated identity ≠ authorized resource access</text></g></svg>
