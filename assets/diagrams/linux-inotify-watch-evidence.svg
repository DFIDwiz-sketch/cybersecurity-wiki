<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">The pathname is stable while the watched inode changes</title>
  <desc id="desc">The parent directory watch can see both sides of the rename. Before replacement the target name points to inode A. After the rename it points to inode B, which can be watched separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91dfca"/>
    </marker>
  </defs>
  <rect width="560" height="330" rx="14" fill="#111d30"/>
  <g fill="#1b3048" stroke="#91dfca" stroke-width="1.5">
    <rect x="25" y="20" width="510" height="50" rx="9"/>
    <rect x="25" y="107" width="220" height="56" rx="9"/>
    <rect x="315" y="107" width="220" height="56" rx="9"/>
    <rect x="25" y="192" width="220" height="51" rx="9"/>
    <rect x="315" y="192" width="220" height="51" rx="9"/>
    <rect x="25" y="270" width="510" height="40" rx="9"/>
  </g>
  <g fill="none" stroke="#91dfca" stroke-width="2" marker-end="url(#arrow)">
    <path d="M135 70V104"/>
    <path d="M425 70V104"/>
    <path d="M245 135H312"/>
    <path d="M135 163V189"/>
    <path d="M425 163V189"/>
  </g>
  <g fill="#f3f7fc" font-family="system-ui, sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="700">
      <text x="280" y="51">Parent directory watch observes the name change</text>
      <text x="135" y="131">Before replacement</text>
      <text x="425" y="131">After replacement</text>
      <text x="135" y="223">Direct watch on A</text>
      <text x="425" y="223">New direct watch on B</text>
    </g>
    <g font-size="15">
      <text x="135" y="151">app.conf points to inode A</text>
      <text x="425" y="151">app.conf points to inode B</text>
      <text x="280" y="123">rename</text>
      <text x="280" y="295">A direct watch follows the object resolved when it was added.</text>
    </g>
  </g>
</svg>
