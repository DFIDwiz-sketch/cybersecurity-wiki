<svg xmlns="http://www.w3.org/2000/svg" width="360" height="344" viewBox="0 0 360 344" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Investigating a systemd timer</title>
  <desc id="desc">Start with the loaded timer and service. When an invocation is observed, check the job result. Otherwise check the manager state, boot and journal coverage.</desc>
  <rect width="360" height="344" rx="12" fill="#ecf4fc"/>
  <path d="M180 68v19m-5-6 5 6 5-6 M180 149v18H91v13m-5-6 5 6 5-6 M180 167h89v13m-5-6 5 6 5-6 M91 250v20m-5-6 5 6 5-6" fill="none" stroke="#245981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143a57">
    <rect x="16" y="12" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="34" font-size="15" font-weight="700">Loaded timer and target</text>
    <text x="180" y="53" font-size="12">System or user manager</text>
    <rect x="16" y="91" width="328" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="113" font-size="15" font-weight="700">Timer event and expected window</text>
    <text x="180" y="132" font-size="12">Is there a service invocation?</text>
    <rect x="8" y="184" width="166" height="66" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="206" font-size="15" font-weight="700">Invocation observed</text>
    <text x="91" y="225" font-size="12">Match its ID and result</text>
    <rect x="186" y="184" width="166" height="66" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="269" y="206" font-size="15" font-weight="700">Invocation missing</text>
    <text x="269" y="225" font-size="12">Check manager, boot,</text>
    <text x="269" y="241" font-size="12">and journal coverage</text>
    <rect x="8" y="274" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="296" font-size="15" font-weight="700">Verify the job result</text>
    <text x="91" y="315" font-size="12">Receipt or artifact</text>
  </g>
</svg>
