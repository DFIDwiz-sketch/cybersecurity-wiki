<svg xmlns="http://www.w3.org/2000/svg" width="360" height="318" viewBox="0 0 360 318" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">Alice의 SMTP 전송 추적</title>
  <desc id="desc">발신 큐에서 일시 실패를 보고 재시도 후 최종 인수를 확인합니다. 수신 측 처리 결과는 해당 시스템의 기록을 확인합니다.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#325977"/></marker></defs>
  <rect x="1" y="1" width="358" height="316" rx="16" fill="#f6f9fd" stroke="#adc6da"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143650">
  <rect x="26" y="16" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="41" font-size="20" font-weight="bold">발신 큐 A1</text>
  <text x="180" y="62" font-size="16">09:00 UTC · 봉투 수신자 Alice</text>
  <path d="M180 76v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="92" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="117" font-size="20" font-weight="bold">첫 시도: 451</text>
  <text x="180" y="138" font-size="16">데이터 종료 후 일시 실패</text>
  <path d="M180 152v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="168" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="193" font-size="20" font-weight="bold">재시도: 최종 250</text>
  <text x="180" y="214" font-size="16">09:17 UTC · 수신 큐 B73</text>
  <path d="M180 228v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="244" width="308" height="58" rx="10" fill="#e4f4eb" stroke="#7b9bb4"/>
  <text x="180" y="269" font-size="20" font-weight="bold">수신 측 추적</text>
  <text x="180" y="290" font-size="16">배달, 격리 또는 이후 실패</text>
  </g>
</svg>
