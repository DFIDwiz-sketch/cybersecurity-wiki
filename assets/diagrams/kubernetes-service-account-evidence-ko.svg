<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">Pod에 바인딩된 서비스 계정 토큰</title>
  <desc id="desc">Pod가 서비스 계정 지정. kubelet이 토큰 발급 요청. 앱이 마운트된 토큰 읽기. API가 토큰과 신원 확인. 인가기가 요청 동작 검사. 감사 로그에 결과 기록.</desc>
  <rect width="440" height="410" rx="14" fill="#101b2a"/>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a3bed7"/></marker></defs>
  <g font-family="system-ui,sans-serif" font-size="21" fill="#f1f7ff">
  <rect x="15" y="12" width="410" height="48" rx="10" fill="#172c48" stroke="#8ac2e0"/>
  <text x="220" y="43" text-anchor="middle">Pod가 서비스 계정 지정</text>
  <path d="M220 60v16" stroke="#a3bed7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="15" y="79" width="410" height="48" rx="10" fill="#172c48" stroke="#8ac2e0"/>
  <text x="220" y="110" text-anchor="middle">kubelet이 토큰 발급 요청</text>
  <path d="M220 127v16" stroke="#a3bed7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="15" y="146" width="410" height="48" rx="10" fill="#172c48" stroke="#8ac2e0"/>
  <text x="220" y="177" text-anchor="middle">앱이 마운트된 토큰 읽기</text>
  <path d="M220 194v16" stroke="#a3bed7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="15" y="213" width="410" height="48" rx="10" fill="#153647" stroke="#8ac2e0"/>
  <text x="220" y="244" text-anchor="middle">API가 토큰과 신원 확인</text>
  <path d="M220 261v16" stroke="#a3bed7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="15" y="280" width="410" height="48" rx="10" fill="#153647" stroke="#8ac2e0"/>
  <text x="220" y="311" text-anchor="middle">인가기가 요청 동작 검사</text>
  <path d="M220 328v16" stroke="#a3bed7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="15" y="347" width="410" height="48" rx="10" fill="#153647" stroke="#8ac2e0"/>
  <text x="220" y="378" text-anchor="middle">감사 로그에 결과 기록</text>
  </g>
</svg>
