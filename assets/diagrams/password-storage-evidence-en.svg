<svg xmlns="http://www.w3.org/2000/svg" width="440" height="354" viewBox="0 0 440 354" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Password registration and login</title>
  <desc id="desc">The service creates a fresh salt at registration and reuses that record's salt and settings to check a submitted password.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="440" height="354" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 101v19"/><path d="M220 180v20"/><path d="M220 261v20"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="29" font-size="18" font-weight="700">Password registration and login</text>
    <rect x="35" y="44" width="370" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">Registration</text>
    <text x="220" y="89" font-size="15">Password, fresh salt and costs</text>
    <rect x="35" y="123" width="370" height="57" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="220" y="146" font-size="17" font-weight="700">Stored verifier record</text>
    <text x="220" y="168" font-size="15">Version, salt, costs and value</text>
    <rect x="35" y="204" width="370" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="227" font-size="17" font-weight="700">Login</text>
    <text x="220" y="249" font-size="15">Recalculate with stored settings</text>
    <rect x="35" y="285" width="370" height="57" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="220" y="308" font-size="17" font-weight="700">Compare and decide</text>
    <text x="220" y="330" font-size="15">Check any further sign-in steps</text>
  </g>
</svg>
