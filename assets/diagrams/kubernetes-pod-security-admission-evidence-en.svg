<svg xmlns="http://www.w3.org/2000/svg" width="440" height="348" viewBox="0 0 440 348" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">From template to Pod runtime</title>
  <desc id="desc">The top two steps show the workload template and the later controller request. Pod enforcement can reject the request, or an admitted Pod can proceed to scheduling and runtime checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="440" height="348" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M220 116v27"/>
    <path d="M220 218v16H114v20"/>
    <path d="M220 218v16h106v20"/>
  </g>
  <g stroke-width="1.2">
    <rect x="46" y="44" width="348" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="46" y="146" width="348" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="10" y="256" width="208" height="78" rx="10" fill="#fff1f2" stroke="#be123c"/>
    <rect x="222" y="256" width="208" height="78" rx="10" fill="#ecfdf5" stroke="#047857"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
    <g font-size="18" font-weight="700">
      <text x="220" y="28">From template to Pod runtime</text>
      <text x="220" y="74">Deployment template</text>
      <text x="220" y="176">Controller requests a Pod</text>
      <text x="114" y="283">Request rejected</text>
      <text x="326" y="283">Pod created</text>
    </g>
    <g font-size="15">
      <text x="220" y="98">Warn and audit may flag the template</text>
      <text x="220" y="200">PSA applies enforce mode to the Pod</text>
      <text x="114" y="311">No Pod from this request</text>
      <text x="326" y="305">Check scheduling and</text>
      <text x="326" y="324">container state</text>
    </g>
  </g>
</svg>
