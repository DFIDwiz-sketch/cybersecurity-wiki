<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 308" width="420" height="308" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">같은 REFUSED에서 근거 나누기</title>
  <desc id="desc">응답 코드와 선택적인 EDE를 각각 읽습니다. 보고된 이유에 따라 도메인 정책, 클라이언트 권한 또는 원본 응답 경로를 확인합니다.</desc>
  <rect x="1" y="1" width="418" height="306" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#475569"/></marker></defs>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210 57v16"/>
    <path d="M210 114v15H74v16"/><path d="M210 114v31"/><path d="M210 114v15h136v16"/>
    <path d="M74 216v17h69v15"/><path d="M210 216v32"/><path d="M346 216v17h-69v15"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="54" y="17" width="312" height="40" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="42" font-size="17" font-weight="700">DNS 응답 · REFUSED</text>
    <rect x="54" y="74" width="312" height="40" rx="8" fill="#e2e8f0" stroke="#475569"/>
