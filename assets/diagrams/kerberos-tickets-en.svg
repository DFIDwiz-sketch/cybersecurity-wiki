<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="TGT vs service ticket: who protects what?"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#80e4c2" stroke-width="1.8"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f7bd69" stroke-width="1.8"/></marker></defs><style>.a{font:700 25px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:15px Arial,'Noto Sans KR',sans-serif;fill:#bdcdd9}.head{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#f5fcfb;text-anchor:middle}.mid{font:14px Arial,'Noto Sans KR',sans-serif;fill:#d1e3eb;text-anchor:middle}.note{font:14px Arial,'Noto Sans KR',sans-serif;fill:#f7bd69;text-anchor:middle}.line{fill:none;stroke:#80e4c2;stroke-width:2.6;marker-end:url(#arr)}.goldline{fill:none;stroke:#f7bd69;stroke-width:2.6;marker-end:url(#gold)}.dash{fill:none;stroke:#64748b;stroke-width:1.3;stroke-dasharray:6 7}</style><rect width="1100" height="470" fill="#0d1828" rx="16"/><text x="30" y="39" class="a">TGT vs service ticket: who protects what?</text><text x="30" y="62" class="b">TGT uses the krbtgt key; the service ticket uses the target service principal's secret</text><rect x="24" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#80e4c2" stroke-width="1.6"/><text x="189" y="135" class="head">TGT (Ticket Granting Ticket)</text><text x="189" y="157" class="mid">Protected by krbtgt key</text><text x="189" y="231" class="mid">Consumed by KDC / TGS</text><rect x="385" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#f7bd69" stroke-width="1.6"/><text x="550" y="135" class="head">TGS (Service Ticket)</text><text x="550" y="157" class="mid">Protected by service key</text><text x="550" y="231" class="mid">Consumed by target service</text><rect x="746" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#60a5fa" stroke-width="1.6"/><text x="911" y="135" class="head">PAC / authorization data</text><text x="911" y="157" class="mid">Group SIDs and other claims</text><text x="911" y="231" class="mid">Signatures and policy matter</text><path d="M180 274 V317 H911 V274" class="dash"/><text x="550" y="354" class="note">Possessing a ticket does not mean knowing the plaintext password</text><text x="550" y="387" class="mid">Client ↔ KDC ↔ Service | session keys, timestamps and lifetimes</text></svg>