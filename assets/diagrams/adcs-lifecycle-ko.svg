<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">AD CS: 등록에서 자원 접근까지</title><desc id="desc">발급, 인증, 권한 부여는 별도 단계입니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">AD CS: 등록에서 자원 접근까지</text><g transform="translate(40,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">1. 클라이언트 키</text><text x="14" y="62" font-size="15" fill="#edf4ff">공개키 / 개인키</text><text x="14" y="87" font-size="15" fill="#edf4ff">키 보관 보호</text></g><g transform="translate(247.2,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">2. 등록 요청</text><text x="14" y="62" font-size="15" fill="#edf4ff">신원 + 템플릿</text><text x="14" y="87" font-size="15" fill="#edf4ff">등록 엔드포인트</text></g><g transform="translate(454.4,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">3. CA 판단</text><text x="14" y="62" font-size="15" fill="#edf4ff">정책 + 권한</text><text x="14" y="87" font-size="15" fill="#edf4ff">발급 / 거부 / 보류</text></g><g transform="translate(661.5999999999999,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">4. 인증</text><text x="14" y="62" font-size="15" fill="#edf4ff">개인키 보유 증명</text><text x="14" y="87" font-size="15" fill="#edf4ff">신뢰 + 매핑</text></g><g transform="translate(868.8,72)"><rect width="191.2" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">5. 자원 접근</text><text x="14" y="62" font-size="15" fill="#edf4ff">매핑된 신원</text><text x="14" y="87" font-size="15" fill="#edf4ff">권한 부여 정책</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">인증서 발급 ≠ 신원 인증 ≠ 자원 접근 허용</text></g></svg>
