<svg xmlns="http://www.w3.org/2000/svg" width="360" height="318" viewBox="0 0 360 318" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Follow Alice’s SMTP attempts</title>
  <desc id="desc">The sender queue sees a temporary response and a retry with a final acceptance. A separate recipient-side trace establishes later disposition.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#325977"/></marker></defs>
  <rect x="1" y="1" width="358" height="316" rx="16" fill="#f6f9fd" stroke="#adc6da"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143650">
  <rect x="26" y="16" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="41" font-size="20" font-weight="bold">Sender queue A1</text>
  <text x="180" y="62" font-size="16">09:00 UTC · Alice’s envelope recipient</text>
  <path d="M180 76v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="92" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="117" font-size="20" font-weight="bold">First attempt: 451</text>
  <text x="180" y="138" font-size="16">Temporary end-of-data response</text>
  <path d="M180 152v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="168" width="308" height="58" rx="10" fill="#e1effa" stroke="#7b9bb4"/>
  <text x="180" y="193" font-size="20" font-weight="bold">Retry: final 250</text>
  <text x="180" y="214" font-size="16">09:17 UTC · receiver queue B73</text>
  <path d="M180 228v15" stroke="#325977" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="26" y="244" width="308" height="58" rx="10" fill="#e4f4eb" stroke="#7b9bb4"/>
  <text x="180" y="269" font-size="20" font-weight="bold">Receiving trace</text>
  <text x="180" y="290" font-size="16">Delivery, quarantine or later failure</text>
  </g>
</svg>
