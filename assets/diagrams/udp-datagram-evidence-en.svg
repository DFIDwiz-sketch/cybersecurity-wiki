  <title id="title">UDP datagram observation points</title><desc id="desc">A sensor can observe a datagram sent by an app. At the receiver, the read can return a whole message or truncate it. Check the application outcome separately.</desc>
  <rect width="420" height="375" rx="18" fill="#122431"/>
  <g fill="#192f40" stroke="#79e1c2" stroke-width="2">
    <rect x="66" y="18" width="288" height="42" rx="9"/>
    <rect x="66" y="87" width="288" height="42" rx="9"/>
    <rect x="66" y="156" width="288" height="42" rx="9"/>
    <rect x="15" y="251" width="188" height="50" rx="9"/>
    <rect x="217" y="251" width="188" height="50" rx="9"/>
    <rect x="51" y="321" width="318" height="38" rx="9" stroke-dasharray="5 4"/>
  </g>
  <g stroke="#79e1c2" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M210 61v21m-4-4 4 4 4-4M210 130v21m-4-4 4 4 4-4M210 199v33H109v13m-4-4 4 4 4-4M210 232h101v13m-4-4 4 4 4-4"/>
  </g>
