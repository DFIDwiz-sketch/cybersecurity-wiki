    <text x="210" y="44">Sending app · sendto()</text><text x="210" y="113">Network sensor</text>
    <text x="210" y="182">Receiving socket · recvmsg()</text><text x="127" y="223">Fits buffer</text><text x="298" y="223">Buffer too small</text>
    <text x="109" y="281">Whole message</text><text x="311" y="281" font-size="15">Prefix and MSG_TRUNC</text>
    <text x="210" y="345">Separate evidence · App result</text>
