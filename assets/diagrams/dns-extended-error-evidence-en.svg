<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 308" width="420" height="308" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Same REFUSED, different evidence</title>
  <desc id="desc">Read response code and optional EDE separately. Check the policy event, client authorization or raw response path according to the reason that was reported.</desc>
  <rect x="1" y="1" width="418" height="306" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#475569"/></marker></defs>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210 57v16"/>
    <path d="M210 114v15H74v16"/><path d="M210 114v31"/><path d="M210 114v15h136v16"/>
    <path d="M74 216v17h69v15"/><path d="M210 216v32"/><path d="M346 216v17h-69v15"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="54" y="17" width="312" height="40" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="42" font-size="17" font-weight="700">DNS response · REFUSED</text>
    <rect x="54" y="74" width="312" height="40" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="99" font-size="16" font-weight="700">Read all EDE options</text>
    <rect x="10" y="146" width="128" height="70" rx="8" fill="#e0f2fe" stroke="#075985"/>
    <text x="74" y="167" font-size="15" font-weight="700">EDE 15</text>
    <text x="74" y="186" font-size="13">Domain policy</text>
    <text x="74" y="205" font-size="13">Match rule</text>
    <rect x="146" y="146" width="128" height="70" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="210" y="167" font-size="15" font-weight="700">EDE 18</text>
    <text x="210" y="186" font-size="13">Client access</text>
    <text x="210" y="205" font-size="13">Check ACL</text>
    <rect x="282" y="146" width="128" height="70" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="346" y="167" font-size="15" font-weight="700">No EDE</text>
    <text x="346" y="186" font-size="13">Cause open</text>
    <text x="346" y="205" font-size="13">Check logs</text>
    <rect x="54" y="249" width="312" height="40" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="274" font-size="16" font-weight="700">Corroborate at the resolver</text>
  </g>
</svg>
