<svg xmlns="http://www.w3.org/2000/svg" width="440" height="354" viewBox="0 0 440 354" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">비밀번호 등록과 로그인</title>
  <desc id="desc">가입할 때 새 솔트를 만들고, 로그인할 때는 저장된 솔트와 설정으로 입력 비밀번호를 확인합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="440" height="354" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 101v19"/><path d="M220 180v20"/><path d="M220 261v20"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="29" font-size="18" font-weight="700">비밀번호 등록과 로그인</text>
    <rect x="35" y="44" width="370" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">등록</text>
    <text x="220" y="89" font-size="15">비밀번호·새 솔트·비용 설정</text>
    <rect x="35" y="123" width="370" height="57" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="220" y="146" font-size="17" font-weight="700">검증 레코드 저장</text>
    <text x="220" y="168" font-size="15">버전·솔트·비용·계산 결과</text>
    <rect x="35" y="204" width="370" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="227" font-size="17" font-weight="700">로그인</text>
    <text x="220" y="249" font-size="15">저장된 설정으로 다시 계산</text>
    <rect x="35" y="285" width="370" height="57" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="220" y="308" font-size="17" font-weight="700">비교와 판정</text>
    <text x="220" y="330" font-size="15">추가 로그인 단계도 확인</text>
  </g>
</svg>
