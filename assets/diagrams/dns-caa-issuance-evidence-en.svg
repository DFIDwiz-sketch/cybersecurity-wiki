<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Find the applicable CAA set</title>
  <desc id="desc">Query one name at a time. Apply a returned set, check a parent after an empty answer, or investigate a lookup error.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4 0 8Z" fill="#475569"/>
  </marker></defs>
  <rect width="440" height="210" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 101v22H75v20"/><path d="M220 101v42"/><path d="M220 101v22h145v20"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="28" font-size="18" font-weight="700">Find the applicable CAA set</text>
    <rect x="56" y="44" width="328" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">Query the name and follow aliases</text>
    <text x="220" y="89" font-size="14">Start at the base name for a wildcard</text>
    <rect x="8" y="147" width="134" height="51" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="75" y="168" font-size="16" font-weight="700">Set found</text>
    <text x="75" y="188" font-size="12">Evaluate issuer tags</text>
    <rect x="153" y="147" width="134" height="51" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="168" font-size="16" font-weight="700">Empty result</text>
    <text x="220" y="188" font-size="12">Check query parent</text>
    <rect x="298" y="147" width="134" height="51" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="365" y="168" font-size="16" font-weight="700">Lookup error</text>
    <text x="365" y="188" font-size="12">Preserve evidence</text>
  </g>
</svg>
