<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-labelledby="title desc"><title id="title">HTTP observation points</title><desc id="desc">Client → Proxy / WAF · request ID → App · request ID / work ID → Worker · work ID. The app may enqueue asynchronous work.</desc><rect width="380" height="300" rx="14" fill="#15243b"/><g text-anchor="middle" fill="#eff6ff" font-family="sans-serif" font-size="19"><rect x="35" y="16" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="43">Client</text><text x="190" y="80" fill="#83ebd2">↕</text><rect x="35" y="88" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="115">Proxy / WAF · request ID</text><text x="190" y="152" fill="#83ebd2">↕</text><rect x="35" y="160" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="187">App · request ID / work ID</text><text x="190" y="224" fill="#83ebd2">↓</text><rect x="35" y="232" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="259">Worker · work ID</text></g></svg>