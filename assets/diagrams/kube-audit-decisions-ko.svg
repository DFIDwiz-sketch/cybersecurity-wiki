<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" role="img" aria-labelledby="title description" lang="ko">
  <title id="title">API 요청 판단과 감사 증거</title>
  <desc id="description">인증은 호출자를 식별하고 인가는 권한을 확인합니다. 허용된 쓰기 요청은 어드미션 검사를 거쳐 저장될 수 있습니다. 드라이런은 객체를 저장하지 않고 응답을 돌려줍니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ee7c2"/>
    </marker>
  </defs>
  <rect width="440" height="410" rx="18" fill="#111b27"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
  <rect x="70" y="16" width="300" height="58" rx="11" fill="#1c2b3c" stroke="#6c91ad"/>
  <text x="220.0" y="41" font-size="19" font-weight="650" fill="#f1f6fc">인증</text>
  <text x="220.0" y="62" font-size="16" fill="#b9d8e9">누가 호출했나요?</text>
  <rect x="70" y="103" width="300" height="58" rx="11" fill="#1c2b3c" stroke="#6c91ad"/>
  <text x="220.0" y="128" font-size="19" font-weight="650" fill="#f1f6fc">인가</text>
  <text x="220.0" y="149" font-size="16" fill="#b9d8e9">이 작업에 권한이 있나요?</text>
  <rect x="70" y="207" width="300" height="58" rx="11" fill="#1c2b3c" stroke="#6c91ad"/>
  <text x="220.0" y="232" font-size="19" font-weight="650" fill="#f1f6fc">어드미션과 검증</text>
  <text x="220.0" y="253" font-size="16" fill="#b9d8e9">이 변경을 받아들일 수 있나요?</text>
  <rect x="11" y="326" width="199" height="67" rx="11" fill="#1c2b3c" stroke="#6c91ad"/>
  <text x="110.5" y="351" font-size="19" font-weight="650" fill="#f1f6fc">저장소에 반영</text>
  <text x="110.5" y="372" font-size="16" fill="#b9d8e9">일반 쓰기 요청</text>
  <rect x="230" y="326" width="199" height="67" rx="11" fill="#1c2b3c" stroke="#6c91ad"/>
  <text x="329.5" y="351" font-size="19" font-weight="650" fill="#f1f6fc">결과만 반환</text>
  <text x="329.5" y="372" font-size="16" fill="#b9d8e9">드라이런은 저장 생략</text>
  <text x="296" y="190" font-size="16" fill="#b3ffe9">허용된 쓰기</text>
  </g>
  <g fill="none" stroke="#5ee7c2" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 220 75 V 101"/>
    <path d="M 220 162 V 205"/>
    <path d="M 195 266 V 293 H 111 V 324"/>
    <path d="M 245 266 V 293 H 329 V 324"/>
  </g>
</svg>
