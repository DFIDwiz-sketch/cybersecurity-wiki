<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">IPv6 이웃 주소 확인과 증거</title>
  <desc id="description">경로 선택, 같은 링크의 메시지 교환, 수신 단말의 캐시를 차례로 확인합니다.</desc>
  <rect width="480" height="400" rx="16" fill="#101b2b"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#81e6d9" stroke-width="2"/></marker></defs>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="46" fill="#a2fff1" font-size="22" font-weight="700">1  다음 홉 선택</text>
    <text x="32" y="75" fill="#eff6ff" font-size="18">패킷에는 원래 IPv6 목적지를 유지합니다.</text>
    <text x="32" y="100" fill="#eff6ff" font-size="18">경로를 따라 같은 링크의 라우터로 보냅니다.</text>
    <path d="M240 125v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="146" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="178" fill="#a2fff1" font-size="22" font-weight="700">2  라우터의 MAC 주소 확인</text>
    <text x="32" y="207" fill="#eff6ff" font-size="18">NS는 라우터의 IPv6 주소를 대상으로 묻습니다.</text>
    <text x="32" y="232" fill="#eff6ff" font-size="18">NA의 옵션에서 대상의 MAC을 확인합니다.</text>
    <path d="M240 257v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="278" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="310" fill="#a2fff1" font-size="22" font-weight="700">3  두 증거 대조</text>
    <text x="32" y="339" fill="#eff6ff" font-size="18">센서: 같은 링크에서 수집한 메시지.</text>
    <text x="32" y="364" fill="#eff6ff" font-size="18">단말: 이웃 상태와 캐시에 기록된 MAC.</text>
  </g>
</svg>
