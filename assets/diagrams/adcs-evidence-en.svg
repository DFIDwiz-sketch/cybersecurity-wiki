<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">AD CS investigation: join evidence, preserve unknowns</title><desc id="desc">Use CA and database context for request IDs; use issuer and serial for certificate identity.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">AD CS investigation: join evidence, preserve unknowns</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">Issuing CA</text><text x="14" y="62" font-size="15" fill="#edf4ff">4886 / 4887 / 4888</text><text x="14" y="87" font-size="15" fill="#edf4ff">Request + disposition</text><text x="14" y="112" font-size="15" fill="#edf4ff">Final certificate</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">Directory / DC</text><text x="14" y="62" font-size="15" fill="#edf4ff">5136 + ACL history</text><text x="14" y="87" font-size="15" fill="#edf4ff">Mapping + 4768</text><text x="14" y="112" font-size="15" fill="#edf4ff">Check raw fields</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">Enrollment endpoint</text><text x="14" y="62" font-size="15" fill="#edf4ff">IIS / RPC context</text><text x="14" y="87" font-size="15" fill="#edf4ff">Identity + source</text><text x="14" y="112" font-size="15" fill="#edf4ff">EPA / policy</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">Client / destination</text><text x="14" y="62" font-size="15" fill="#edf4ff">Key-use context</text><text x="14" y="87" font-size="15" fill="#edf4ff">Logons + EDR</text><text x="14" y="112" font-size="15" fill="#edf4ff">Actual access</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">Request key: CA + database + request ID   |   Certificate key: issuer + serial</text></g></svg>
