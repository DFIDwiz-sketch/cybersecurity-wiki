<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" role="img" aria-label="NTLM 위험 축소: 다층 방어"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#72dcbd" stroke-width="1.5"/></marker></defs><style>.ttl{font:bold 24px Arial,'Noto Sans KR',sans-serif;fill:#f4f8fc}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5c5d4}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc;text-anchor:middle}.small{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.arrow{stroke:#72dcbd;stroke-width:2.5;fill:none;marker-end:url(#a)}.line{stroke:#72dcbd;stroke-width:2;fill:none}.warn{fill:#ffd180;font:13px Arial,'Noto Sans KR',sans-serif;text-anchor:middle}.dim{font:13px Arial,'Noto Sans KR',sans-serif;fill:#aab8c9;text-anchor:middle}</style><rect x="0" y="0" width="980" height="415" rx="18" fill="#0d1828"/><text x="28" y="38" class="ttl">NTLM 위험 축소: 다층 방어</text><text x="28" y="61" class="sub">감사 → 정리 → 인증 보강 → 단계적 차단 → 탐지</text><rect x="9" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="99" y="160" class="head">NTLM 감사</text><text x="99" y="182" class="small">4624 / 4776 / 800x</text><path class="arrow" d="M190 183 H203"/><rect x="206" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="296" y="160" class="head">의존 시스템 식별</text><text x="296" y="182" class="small">NAS · 앱 · 서비스</text><path class="arrow" d="M387 183 H400"/><rect x="403" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="493" y="160" class="head">Kerberos·SPN 정비</text><text x="493" y="182" class="small">DNS · 서비스 계정</text><path class="arrow" d="M584 183 H597"/><rect x="600" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="690" y="160" class="head">SMB Signing / CBT</text><text x="690" y="182" class="small">SMB / LDAPS / HTTP EPA</text><path class="arrow" d="M781 183 H794"/><rect x="797" y="132" width="180" height="105" rx="12" fill="#1e3047" stroke="#ffd180" stroke-width="1.5"/><text x="887" y="160" class="head">NTLM 제한·모니터링</text><text x="887" y="182" class="small">예외 최소화 + 검증</text><text x="490" y="305" class="warn">SMB Signing은 SMB Relay 보호, LDAP CBT는 TLS 기반 SASL 인증 중계 방어에 중요</text></svg>