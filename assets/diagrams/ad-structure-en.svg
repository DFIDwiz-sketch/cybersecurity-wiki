<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Active Directory logical hierarchy"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#67d1bb" stroke-width="1.5"/></marker></defs><rect width="1000" height="400" rx="16" fill="#101c29"/><style>.title{font:bold 23px Arial,'Noto Sans KR',sans-serif;fill:#f1f5f9}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f7fcfa;text-anchor:middle}.body{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.small{font:12px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.link{fill:none;stroke:#67d1bb;stroke-width:2.4;marker-end:url(#a)}.plain{fill:none;stroke:#67d1bb;stroke-width:2}.note{font:13px Arial,'Noto Sans KR',sans-serif;fill:#b5cccf;text-anchor:middle}</style><text x="28" y="37" class="title">Active Directory logical hierarchy</text><text x="28" y="59" class="sub">Forest → Domains → OUs → users/groups/computers; an OU is not a security boundary</text><rect x="320" y="83" width="360" height="65" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="500" y="110" class="head">Forest</text><text x="500" y="132" class="body">Common schema, config, trust</text><rect x="80" y="190" width="375" height="70" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="267.5" y="217" class="head">Domain: corp.example.com</text><text x="267.5" y="239" class="body">Identity and replication unit</text><rect x="545" y="190" width="375" height="70" rx="11" fill="#1d3344" stroke="#4cbfae" stroke-width="1.8"/><text x="732.5" y="217" class="head">Domain: research.example.com</text><text x="732.5" y="239" class="body">Another domain in the same forest</text><path class="plain" d="M500 148 V172 H268 V190 M500 172 H732 V190"/><rect x="85" y="292" width="175" height="65" rx="11" fill="#1d3344" stroke="#60a5fa" stroke-width="1.8"/><text x="172.5" y="319" class="head">OU: Workstations</text><text x="172.5" y="341" class="body">Computers and policies</text><rect x="280" y="292" width="175" height="65" rx="11" fill="#1d3344" stroke="#60a5fa" stroke-width="1.8"/><text x="367.5" y="319" class="head">OU: Employees</text><text x="367.5" y="341" class="body">Users and groups</text><path class="plain" d="M268 260 V278 H172 V292 M268 278 H367 V292"/><text x="680" y="330" class="note">OU = policy/delegation; forest = major security boundary</text></svg>