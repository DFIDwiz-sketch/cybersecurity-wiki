<svg xmlns="http://www.w3.org/2000/svg" width="480" height="384" viewBox="0 0 480 384" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">LDAP transport, bind and authorization</title>
  <desc id="desc">Determine actual transport first. Choose the bind mode. Simple bind relies on transport protection. For applicable SASL over TLS, evaluate channel binding. An accepted bind is followed by operation authorization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2c496a"/>
    </marker>
  </defs>
  <rect width="480" height="384" rx="18" fill="#f5f8fe"/>
  <g fill="#e7effc" stroke="#395884" stroke-width="2">
    <rect x="79" y="18" width="322" height="58" rx="10"/>
    <rect x="16" y="118" width="205" height="62" rx="10"/>
    <rect x="259" y="118" width="205" height="62" rx="10"/>
    <rect x="79" y="306" width="322" height="61" rx="10"/>
  </g>
  <rect x="249" y="217" width="225" height="61" rx="10" fill="#e5f3ea" stroke="#34684e" stroke-width="2"/>
  <g fill="none" stroke="#2c496a" stroke-width="2.5">
    <path d="M240 76 V95 H118 V113" marker-end="url(#arrow)"/>
    <path d="M240 95 H361 V113" marker-end="url(#arrow)"/>
    <path d="M118 180 V291 H180 V301" marker-end="url(#arrow)"/>
    <path d="M361 180 V212" marker-end="url(#arrow)"/>
    <path d="M361 278 V291 H300 V301" marker-end="url(#arrow)"/>
    <path d="M259 150 H239 V301" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#152942">
    <g font-weight="700" font-size="20">
      <text x="240" y="43">Client connects to the DC</text>
      <text x="118" y="143">Simple bind</text>
      <text x="361" y="143">SASL bind</text>
      <text x="361" y="241" font-size="17">TLS + applicable SASL</text>
      <text x="240" y="331">Accepted bind</text>
    </g>
    <g font-size="16">
      <text x="240" y="64">LDAP transport or TLS</text>
      <text x="118" y="165">Transport protection</text>
      <text x="361" y="165">Negotiated protection</text>
      <text x="361" y="263" font-size="14">Check CBT policy and result</text>
      <text x="240" y="353">Authorize the directory operation</text>
    </g>
  </g>
</svg>
