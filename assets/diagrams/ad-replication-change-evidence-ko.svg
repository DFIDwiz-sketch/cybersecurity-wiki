<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" lang="ko" width="440" height="324" viewBox="0 0 440 324">
  <title id="title">도메인 컨트롤러 복제와 감사 증거</title>
  <desc id="desc">원본 쓰기는 복제 메타데이터를 만듭니다. 감사 조건에 맞으면 변경이 기록됩니다. 복제본이 같은 원본 정보를 갖고도 로컬 USN은 다를 수 있습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bee0e8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="322" rx="14" fill="#101f2b"/>
  <g fill="none" stroke="#bee0e8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 64 V84 H104 V127"/>
    <path d="M220 64 V84 H320 V127"/>
    <path d="M320 171 V196"/>
    <path d="M320 240 V264"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#f0f7fc">
    <rect x="53" y="22" width="334" height="42" rx="8" fill="#153744" stroke="#7dc5cf"/>
    <text x="220" y="49" font-size="17">DC A에서 승인된 속성 변경</text>
    <text x="62" y="112" font-size="13" fill="#ffd5b7">감사 증거</text>
    <text x="365" y="112" font-size="13" fill="#bcf8cd">복제 증거</text>
    <rect x="12" y="129" width="184" height="42" rx="8" fill="#4c3028" stroke="#7dc5cf"/>
    <text x="104" y="156" font-size="15">감사 대상이면 5136</text>
    <rect x="210" y="129" width="220" height="42" rx="8" fill="#184338" stroke="#7dc5cf"/>
    <text x="320" y="156" font-size="14">DC A가 원본 메타데이터 기록</text>
    <rect x="210" y="198" width="220" height="42" rx="8" fill="#184338" stroke="#7dc5cf"/>
    <text x="320" y="225" font-size="14">DC B가 복제 변경 적용</text>
    <rect x="210" y="266" width="220" height="42" rx="8" fill="#184338" stroke="#7dc5cf"/>
    <text x="320" y="293" font-size="14">원본은 같고 로컬 USN은 다름</text>
  </g>
</svg>
