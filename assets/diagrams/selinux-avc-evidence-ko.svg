<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-labelledby="title desc">
  <title id="title">SELinux 파일 요청과 감사 결과</title><desc id="desc">파일 요청에서 DAC를 우선 평가합니다. 여기서 거부되면 이 경로에 대해 AVC가 남지 않습니다. 통과하면 SELinux 정책을 고려하고 레코드와 시스템 호출을 연결합니다.</desc>
  <rect width="420" height="330" rx="18" fill="#122431"/>
  <g fill="#192f40" stroke="#79e1c2" stroke-width="2">
    <rect x="106" y="20" width="208" height="42" rx="9"/>
    <rect x="106" y="93" width="208" height="42" rx="9"/>
    <rect x="13" y="191" width="169" height="56" rx="9"/>
    <rect x="197" y="191" width="210" height="56" rx="9"/>
    <rect x="197" y="277" width="210" height="36" rx="9"/>
  </g>
  <g stroke="#79e1c2" stroke-width="2" stroke-linejoin="round" fill="none">
    <path d="M210 63v26m-4-4 4 4 4-4M210 136v35H97v16m-4-4 4 4 4-4M210 171h92v16m-4-4 4 4 4-4M302 248v24m-4-4 4 4 4-4"/>
  </g>
  <g fill="#f2f8fc" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17">
    <text x="210" y="47">파일 열기 요청</text><text x="210" y="120">DAC 검사</text>
    <text x="125" y="161">먼저 거부</text><text x="277" y="161">통과</text>
    <text x="302" y="225">SELinux 레이블·정책</text><text x="97" y="225" font-size="15">SELinux 검사 전 종료</text>
    <text x="302" y="301" font-size="15">AVC와 시스템 호출 연결</text>
  </g>
</svg>
