<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="TGT와 서비스 티켓: 누가 어떤 키로 보호하나요?"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#80e4c2" stroke-width="1.8"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f7bd69" stroke-width="1.8"/></marker></defs><style>.a{font:700 25px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:15px Arial,'Noto Sans KR',sans-serif;fill:#bdcdd9}.head{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#f5fcfb;text-anchor:middle}.mid{font:14px Arial,'Noto Sans KR',sans-serif;fill:#d1e3eb;text-anchor:middle}.note{font:14px Arial,'Noto Sans KR',sans-serif;fill:#f7bd69;text-anchor:middle}.line{fill:none;stroke:#80e4c2;stroke-width:2.6;marker-end:url(#arr)}.goldline{fill:none;stroke:#f7bd69;stroke-width:2.6;marker-end:url(#gold)}.dash{fill:none;stroke:#64748b;stroke-width:1.3;stroke-dasharray:6 7}</style><rect width="1100" height="470" fill="#0d1828" rx="16"/><text x="30" y="39" class="a">TGT와 서비스 티켓: 누가 어떤 키로 보호하나요?</text><text x="30" y="62" class="b">TGT는 krbtgt 키, 서비스 티켓은 해당 SPN의 서비스 계정 키로 보호됩니다</text><rect x="24" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#80e4c2" stroke-width="1.6"/><text x="189" y="135" class="head">TGT (Ticket Granting Ticket)</text><text x="189" y="157" class="mid">krbtgt 계정 키로 보호</text><text x="189" y="231" class="mid">KDC의 TGS에서 사용</text><rect x="385" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#f7bd69" stroke-width="1.6"/><text x="550" y="135" class="head">TGS (Service Ticket)</text><text x="550" y="157" class="mid">서비스 계정 키로 보호</text><text x="550" y="231" class="mid">대상 서비스에서 사용</text><rect x="746" y="105" width="330" height="152" rx="11" fill="#1c3044" stroke="#60a5fa" stroke-width="1.6"/><text x="911" y="135" class="head">PAC / 인증 데이터</text><text x="911" y="157" class="mid">그룹 SID 등 권한 정보</text><text x="911" y="231" class="mid">서명과 검증 정책 중요</text><path d="M180 274 V317 H911 V274" class="dash"/><text x="550" y="354" class="note">티켓을 가진 것과 비밀번호 원문을 안다는 것은 다릅니다</text><text x="550" y="387" class="mid">Client ↔ KDC ↔ Service | 세션 키와 재전송 보호·유효기간 활용</text></svg>