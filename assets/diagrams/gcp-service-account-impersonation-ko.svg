<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">서비스 계정 토큰 발급과 사용</title>
  <desc id="description">토큰 발급 요청과 후속 리소스 요청은 별도의 증거를 남깁니다.</desc>
  <rect width="480" height="400" rx="16" fill="#101b2b"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#81e6d9" stroke-width="2"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <rect x="14" y="14" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="46" fill="#a2fff1" font-size="22" font-weight="700">1  호출자가 토큰 요청</text>
    <text x="32" y="76" fill="#eff6ff" font-size="18">IAM Credentials가 호출자의 권한을 확인합니다.</text>
    <text x="32" y="101" fill="#eff6ff" font-size="18">발급 대상: 프로젝트 A의 서비스 계정</text>
    <path d="M240 125v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="146" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="178" fill="#a2fff1" font-size="22" font-weight="700">2  IAM이 요청 기록</text>
    <text x="32" y="208" fill="#eff6ff" font-size="18">Data Access에 요청자와 계정이 기록될 수 있습니다.</text>
    <text x="32" y="233" fill="#eff6ff" font-size="18">발급 여부는 작업 결과를 살펴보세요.</text>
    <path d="M240 257v17" stroke="#81e6d9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="278" width="452" height="108" rx="12" fill="#1e3046" stroke="#5f7996"/>
    <text x="32" y="310" fill="#a2fff1" font-size="22" font-weight="700">3  리소스 API가 토큰 수신</text>
    <text x="32" y="340" fill="#eff6ff" font-size="18">프로젝트 B에서 작업과 결과를 기록할 수 있습니다.</text>
    <text x="32" y="365" fill="#eff6ff" font-size="18">위임 정보에 원래 호출자가 표시될 수 있습니다.</text>
  </g>
</svg>
