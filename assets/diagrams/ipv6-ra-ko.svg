<svg xmlns="http://www.w3.org/2000/svg" width="440" height="285" viewBox="0 0 440 285" role="img" aria-labelledby="title desc">
  <title id="title">라우터 광고와 단말 상태 대조</title><desc id="desc">단말은 라우터에 광고를 요청할 수 있습니다. 광고를 본 뒤 단말의 경로, 주소, DNS 상태도 확인합니다.</desc>
