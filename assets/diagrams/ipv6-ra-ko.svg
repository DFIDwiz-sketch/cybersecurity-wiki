  <rect x="1" y="1" width="438" height="283" rx="16" fill="#f4f8fc" stroke="#a9c4d8"/>
  <g fill="#e0edf8" stroke="#7599b7">
    <rect x="34" y="22" width="126" height="44" rx="9"/><rect x="280" y="22" width="126" height="44" rx="9"/>
    <rect x="31" y="196" width="185" height="62" rx="9"/>
  </g>
  <g fill="none" stroke="#315875" stroke-width="2.5">
    <path d="M97 67V191" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M343 67V169" stroke-dasharray="4 4"/>
    <path d="M99 110H340" marker-end="url(#arrow)"/>
    <path d="M341 162H99" marker-end="url(#arrow)"/>
  </g>
  <g fill="#143550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17">
    <text x="97" y="50" font-weight="bold">단말</text><text x="343" y="50" font-weight="bold">라우터</text>
    <text x="220" y="101">라우터 요청 RS</text><text x="220" y="153">설정 광고 RA</text>
    <text x="123" y="222" font-weight="bold">단말 상태 확인</text><text x="123" y="245" font-size="15">경로 · 주소 · DNS</text>
  </g>
</svg>
