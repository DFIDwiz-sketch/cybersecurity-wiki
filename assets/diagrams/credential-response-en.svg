<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Credential-access response: host and identity together</title><desc id="desc">Contain, assess actual exposure, recover affected identities and validate the host.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Credential-access response: host and identity together</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. Preserve + contain</text><text x="14" y="63" font-size="16" fill="#edf4ff">Actor / target / time</text><text x="14" y="89" font-size="16" fill="#edf4ff">Host + raw evidence</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. Assess exposure</text><text x="14" y="63" font-size="16" fill="#edf4ff">Store + protection state</text><text x="14" y="89" font-size="16" fill="#edf4ff">Artifact + account scope</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. Identity response</text><text x="14" y="63" font-size="16" fill="#edf4ff">Trusted rotation / revocation</text><text x="14" y="89" font-size="16" fill="#edf4ff">Sessions + dependencies</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. Recover + verify</text><text x="14" y="63" font-size="16" fill="#edf4ff">Initial access + persistence</text><text x="14" y="89" font-size="16" fill="#edf4ff">Controls + recurrence</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">One blocked action does not prove global containment or revoke earlier stolen material.</text></g></svg>
