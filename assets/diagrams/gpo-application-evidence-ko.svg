<svg xmlns="http://www.w3.org/2000/svg" width="360" height="346" viewBox="0 0 360 346" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">DC에서 단말까지 그룹 정책 증거</title>
  <desc id="desc">GUID로 GPO를 찾고 같은 DC의 AD와 SYSVOL을 비교합니다. 단말에서는 적용 범위, 처리 기록과 실제 설정을 확인합니다.</desc>
  <rect width="360" height="346" rx="12" fill="#ecf4fc"/>
  <path d="M180 68v12H91v12m-5-6 5 6 5-6 M180 80h89v12m-5-6 5 6 5-6 M91 154v19h178v-19 M180 173v20m-5-6 5 6 5-6 M180 253v21m-5-6 5 6 5-6" fill="none" stroke="#245981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#143a57">
    <rect x="16" y="12" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="35" font-size="14" font-weight="700">GPO 식별</text>
    <text x="180" y="54" font-size="12">도메인 · GUID · 지정한 DC</text>
    <rect x="8" y="96" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="91" y="119" font-size="14" font-weight="700">AD 디렉터리</text>
    <text x="91" y="138" font-size="12">GPC 버전과 적용 범위</text>
    <rect x="186" y="96" width="166" height="58" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="269" y="119" font-size="14" font-weight="700">SYSVOL</text>
    <text x="269" y="138" font-size="12">GPT 버전과 정책 파일</text>
    <rect x="16" y="197" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="220" font-size="14" font-weight="700">단말의 정책 처리</text>
    <text x="180" y="239" font-size="12">대상 범위 · RSoP · ActivityID</text>
    <rect x="16" y="278" width="328" height="56" rx="10" fill="#fff" stroke="#7898b3"/>
    <text x="180" y="301" font-size="14" font-weight="700">실제 로컬 설정 확인</text>
    <text x="180" y="320" font-size="12">결과와 시각 기록</text>
  </g>
</svg>
