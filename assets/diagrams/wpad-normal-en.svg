<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" role="img" aria-label="Normal WPAD flow"><style>svg{background:#0f172a;font-family:Arial,'Noto Sans KR',sans-serif}.node{fill:#1e293b;stroke:#64748b;stroke-width:1.5}.danger{stroke:#fb7185}.title{font-size:17px;font-weight:bold;fill:#f8fafc}.sub{font-size:12px;fill:#cbd5e1}.detail{font-size:13px;fill:#e2e8f0;text-anchor:middle}.blue,.red,.green{fill:none;stroke-width:3;stroke-linecap:round}.blue{stroke:#60a5fa}.red{stroke:#fb7185}.green{stroke:#34d399}.dashed{stroke-dasharray:7 7}.foot{font-size:12px;fill:#cbd5e1;text-anchor:middle}</style><path d="M165 61 H195 M345 61 H375 M525 61 H555" class="blue"/><path d="M620 100 V145 H90 V100" class="blue dashed"/><text x="345" y="137" class="detail">PAC downloaded and applied</text><path d="M90 100 V206 H620 V100" class="green"/><text x="355" y="201" class="detail">Web traffic uses configured proxy</text><rect x="15" y="35" width="150" height="65" rx="9" class="node "/><text x="90" y="61" text-anchor="middle" class="title">Client PC</text><text x="90" y="82" text-anchor="middle" class="sub">Find WPAD location</text><rect x="195" y="35" width="150" height="65" rx="9" class="node "/><text x="270" y="61" text-anchor="middle" class="title">DNS / DHCP</text><text x="270" y="82" text-anchor="middle" class="sub">Location response</text><rect x="375" y="35" width="150" height="65" rx="9" class="node "/><text x="450" y="61" text-anchor="middle" class="title">WPAD server</text><text x="450" y="82" text-anchor="middle" class="sub">PAC file delivery</text><rect x="555" y="35" width="130" height="65" rx="9" class="node "/><text x="620" y="61" text-anchor="middle" class="title">Corporate proxy</text><text x="620" y="82" text-anchor="middle" class="sub">Web requests forwarded</text><text x="350" y="289" class="foot">WPAD discovers proxy configuration; WPAD is not itself a proxy.</text></svg>