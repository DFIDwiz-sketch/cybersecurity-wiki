<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">발급과 검증의 두 방향</title><desc id="desc">루트 CA · 로컬 정책으로 신뢰. 중간 CA · 발급자 후보. 최종 인증서 · lab.example.test. 발급 ↓. ↑ 검증. 중간 후보를 제공하는 것 ≠ 루트를 신뢰하는 것. 체인 + 이름 + 용도 + 시간 + 적용되는 상태 정책</desc><rect width="760" height="500" rx="16" fill="#101c30"/><g font-family="Arial,sans-serif" fill="#edf4ff"><text x="30" y="45" font-size="25">발급과 검증의 두 방향</text><rect x="135" y="80" width="490" height="65" rx="10" fill="#203752"/><text x="155" y="120" font-size="21">루트 CA · 로컬 정책으로 신뢰</text><rect x="135" y="190" width="490" height="65" rx="10" fill="#203752"/><text x="155" y="230" font-size="21">중간 CA · 발급자 후보</text><rect x="135" y="300" width="490" height="65" rx="10" fill="#203752"/><text x="155" y="340" font-size="21">최종 인증서 · lab.example.test</text><text x="25" y="235" font-size="20" fill="#71ddd0">발급 ↓</text><text x="635" y="235" font-size="20" fill="#71ddd0">↑ 검증</text><text x="30" y="420" font-size="20">중간 후보를 제공하는 것 ≠ 루트를 신뢰하는 것</text><text x="30" y="465" font-size="18">체인 + 이름 + 용도 + 시간 + 적용되는 상태 정책</text></g></svg>