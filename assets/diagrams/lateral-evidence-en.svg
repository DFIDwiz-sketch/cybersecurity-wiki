<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Correlate source, destination and DC evidence</title><desc id="desc">Source host: Process / explicit credentials: Original time / network; Destination host: Logon / share / service / process: Host-scoped Logon ID; Domain controller: Ticket / credential validation: Not proof of target execution</desc><rect width="1000" height="300" rx="20" fill="#101c2d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="42" font-size="25" font-weight="700" fill="#edf5ff">Correlate source, destination and DC evidence</text><rect x="20" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="32" y="109" font-size="20" font-weight="700" fill="#79ddc3">Source host</text><text x="32" y="146" font-size="16" fill="#eef5ff">Process / explicit credentials</text><text x="32" y="176" font-size="15" fill="#bccfe4">Original time / network</text><text x="322" y="146" font-size="24" fill="#79ddc3">→</text><rect x="350" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="362" y="109" font-size="20" font-weight="700" fill="#79ddc3">Destination host</text><text x="362" y="146" font-size="16" fill="#eef5ff">Logon / share / service / process</text><text x="362" y="176" font-size="15" fill="#bccfe4">Host-scoped Logon ID</text><text x="652" y="146" font-size="24" fill="#79ddc3">→</text><rect x="680" y="75" width="300" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="692" y="109" font-size="20" font-weight="700" fill="#79ddc3">Domain controller</text><text x="692" y="146" font-size="16" fill="#eef5ff">Ticket / credential validation</text><text x="692" y="176" font-size="15" fill="#bccfe4">Not proof of target execution</text><text x="24" y="252" font-size="20" fill="#dce9f8">Correlate identity, host, time and session context. Logon IDs are not global cross-host keys.</text></g></svg>
