<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" lang="en" width="440" height="400" viewBox="0 0 440 400">
  <title id="title">SAML sign-in evidence</title>
  <desc id="desc">The flow branches at SP validation and continues through session creation to authorization.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b5d7df"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="398" rx="14" fill="#10232f"/>
  <g fill="none" stroke="#b5d7df" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 66 V89"/>
    <path d="M220 132 V155"/>
    <path d="M220 198 V218 H150 V254"/>
    <path d="M220 198 V218 H354 V254"/>
    <path d="M150 298 V329"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#f0f7fc">
  <rect x="65" y="24" width="310" height="42" rx="8" fill="#143643" stroke="#77c0c9"/>
  <text x="220" y="51" font-size="18">SP sends a sign-in request</text>
  <rect x="65" y="90" width="310" height="42" rx="8" fill="#143643" stroke="#77c0c9"/>
  <text x="220" y="117" font-size="18">IdP issues a SAML response</text>
  <rect x="65" y="156" width="310" height="42" rx="8" fill="#143643" stroke="#77c0c9"/>
  <text x="220" y="183" font-size="18">SP validates at the ACS</text>
    <text x="112" y="241" font-size="16" fill="#b3f8c9">Accepted</text>
    <text x="392" y="241" font-size="16" fill="#ffd0c8">Rejected</text>
  <rect x="22" y="256" width="256" height="42" rx="8" fill="#174335" stroke="#77c0c9"/>
  <text x="150" y="283" font-size="16">Map account and create session</text>
  <rect x="292" y="256" width="124" height="42" rx="8" fill="#512c31" stroke="#77c0c9"/>
  <text x="354" y="283" font-size="15">Stop this sign-in</text>
  <rect x="22" y="331" width="256" height="42" rx="8" fill="#174335" stroke="#77c0c9"/>
  <text x="150" y="358" font-size="16">App authorizes protected action</text>
  </g>
</svg>
