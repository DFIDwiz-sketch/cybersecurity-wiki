<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">AD CS 조사: 증거 연결과 미확인 구분</title><desc id="desc">요청 번호는 CA와 DB 문맥에, 인증서는 발급자와 일련번호에 연결합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">AD CS 조사: 증거 연결과 미확인 구분</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">발급 CA</text><text x="14" y="62" font-size="15" fill="#edf4ff">4886 / 4887 / 4888</text><text x="14" y="87" font-size="15" fill="#edf4ff">요청 + 처리 결과</text><text x="14" y="112" font-size="15" fill="#edf4ff">최종 인증서</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">디렉터리 / DC</text><text x="14" y="62" font-size="15" fill="#edf4ff">5136 + ACL 이력</text><text x="14" y="87" font-size="15" fill="#edf4ff">매핑 + 4768</text><text x="14" y="112" font-size="15" fill="#edf4ff">원본 필드 확인</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">등록 엔드포인트</text><text x="14" y="62" font-size="15" fill="#edf4ff">IIS / RPC 맥락</text><text x="14" y="87" font-size="15" fill="#edf4ff">신원 + 출발지</text><text x="14" y="112" font-size="15" fill="#edf4ff">EPA / 정책</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="18" fill="#79ddc3">클라이언트 / 대상</text><text x="14" y="62" font-size="15" fill="#edf4ff">키 사용 맥락</text><text x="14" y="87" font-size="15" fill="#edf4ff">로그온 + EDR</text><text x="14" y="112" font-size="15" fill="#edf4ff">실제 자원 접근</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">요청 식별: CA + DB + 요청 번호   |   인증서 식별: 발급자 + 일련번호</text></g></svg>
