<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">DNS 캐시 미스: 리졸버가 각각 질문</title><desc id="desc">클라이언트는 리졸버에 묻고 리졸버가 세 종류의 서버에 별도로 질의합니다. 루트나 TLD가 클라이언트 요청을 전달하는 구조가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#71ddd0"/></marker></defs><rect width="900" height="510" rx="16" fill="#101c30"/><g font-family="Arial,sans-serif" fill="#edf4ff"><text x="25" y="42" font-size="25">DNS 캐시 미스: 리졸버가 각각 질문</text><g stroke="#71ddd0" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M205 250 L300 250"/><path d="M510 225 L650 120"/><path d="M510 250 L650 250"/><path d="M510 275 L650 380"/></g><rect x="30" y="215" width="175" height="70" rx="10" fill="#203752"/><text x="42" y="257" font-size="21">클라이언트</text><rect x="300" y="215" width="210" height="70" rx="10" fill="#203752"/><text x="312" y="257" font-size="21">재귀 리졸버</text><rect x="650" y="85" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="127" font-size="21">루트 서버</text><rect x="650" y="215" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="257" font-size="21">.com TLD</text><rect x="650" y="345" width="220" height="70" rx="10" fill="#203752"/><text x="662" y="387" font-size="21">example.com 권한</text><text x="190" y="190" font-size="16">1. 질문 / 5. 답</text><text x="495" y="125" font-size="18">2. 위임 안내</text><text x="520" y="230" font-size="17">3. 위임 안내</text><text x="495" y="385" font-size="18">4. 데이터 답</text><text x="25" y="475" font-size="21" fill="#71ddd0">캐시가 있으면 일부 상위 질의를 생략합니다.</text></g></svg>