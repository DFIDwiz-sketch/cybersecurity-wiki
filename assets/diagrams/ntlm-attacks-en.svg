<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" role="img" aria-label="Three distinct NTLM attack mechanisms"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#72dcbd" stroke-width="1.5"/></marker></defs><style>.ttl{font:bold 24px Arial,'Noto Sans KR',sans-serif;fill:#f4f8fc}.sub{font:14px Arial,'Noto Sans KR',sans-serif;fill:#b5c5d4}.head{font:bold 17px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc;text-anchor:middle}.small{font:13px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1;text-anchor:middle}.arrow{stroke:#72dcbd;stroke-width:2.5;fill:none;marker-end:url(#a)}.line{stroke:#72dcbd;stroke-width:2;fill:none}.warn{fill:#ffd180;font:13px Arial,'Noto Sans KR',sans-serif;text-anchor:middle}.dim{font:13px Arial,'Noto Sans KR',sans-serif;fill:#aab8c9;text-anchor:middle}</style><rect x="0" y="0" width="980" height="415" rx="18" fill="#0d1828"/><text x="28" y="38" class="ttl">Three distinct NTLM attack mechanisms</text><text x="28" y="61" class="sub">Capture = challenge-response · Relay = live authentication forwarding · PtH = stolen NT hash</text><rect x="16" y="111" width="304" height="146" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="168" y="139" class="head">NTLM Capture</text><text x="168" y="161" class="small">Collect NetNTLM response</text><text x="168" y="205" class="small">Possible offline guessing</text><rect x="24" y="281" width="288" height="67" rx="9" fill="#284058"/><text x="168" y="321" class="small">Not an NT hash dump</text><rect x="342" y="111" width="304" height="146" rx="12" fill="#1e3047" stroke="#f6bd60" stroke-width="1.5"/><text x="494" y="139" class="head">NTLM Relay</text><text x="494" y="161" class="small">Forward live exchange</text><text x="494" y="205" class="small">Depends on target security</text><rect x="350" y="281" width="288" height="67" rx="9" fill="#284058"/><text x="494" y="321" class="small">No password recovery required</text><rect x="668" y="111" width="304" height="146" rx="12" fill="#1e3047" stroke="#72dcbd" stroke-width="1.5"/><text x="820" y="139" class="head">Pass-the-Hash</text><text x="820" y="161" class="small">Authenticate using stolen NT hash</text><text x="820" y="205" class="small">Requires valid hash + permissions</text><rect x="676" y="281" width="288" height="67" rx="9" fill="#284058"/><text x="820" y="321" class="small">Signing alone won't block PtH</text></svg>