<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Kerberoasting 공격 흐름"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#93c5fd" stroke-width="1.5"/></marker><marker id="warningArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#fbbf24" stroke-width="1.5"/></marker></defs><rect width="1000" height="330" fill="#101a2e" rx="16"/><text x="32" y="40" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Kerberoasting 공격 흐름</text><text x="32" y="64" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#a9bdd8">인증된 도메인 계정에서 시작하여 서비스 티켓을 수집하고 오프라인에서 암호를 추측</text><rect x="24" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="109" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">1. 도메인 인증</text><text x="109" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">유효한 TGT</text><path d="M196 148 L216 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="219" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="304" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">2. SPN 목록 파악</text><text x="304" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">서비스 계정 검색</text><path d="M391 148 L411 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="414" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="499" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">3. TGS 요청</text><text x="499" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">DC가 티켓 발급</text><path d="M586 148 L606 148" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#warningArrow)"/><rect x="609" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#fbbf24" stroke-width="1.6"/><text x="694" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">4. 오프라인 추측</text><text x="694" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">암호 후보 검증</text><path d="M781 148 L801 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="804" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#fb7185" stroke-width="1.6"/><text x="889" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">5. 계정 악용</text><text x="889" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">복구 성공 시에만</text><path d="M106 202 V216 H880" fill="none" stroke="#465a7b" stroke-dasharray="6 5" stroke-width="1.5"/><text x="500" y="240" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="15" fill="#93c5fd">DC에 이벤트 4769 기록</text><text x="500" y="263" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="14" fill="#fbbf24">오프라인 단계는 DC 로그인 로그에 남지 않음</text><text x="500" y="288" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="13" fill="#c6d7ec">이후 로그인 시도는 별도 흔적을 남길 수 있음</text></svg>