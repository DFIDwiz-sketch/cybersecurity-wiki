<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Kerberos 인증 전체 흐름: AS → TGS → AP"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#80e4c2" stroke-width="1.8"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f7bd69" stroke-width="1.8"/></marker></defs><style>.a{font:700 25px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:15px Arial,'Noto Sans KR',sans-serif;fill:#bdcdd9}.head{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#f5fcfb;text-anchor:middle}.mid{font:14px Arial,'Noto Sans KR',sans-serif;fill:#d1e3eb;text-anchor:middle}.note{font:14px Arial,'Noto Sans KR',sans-serif;fill:#f7bd69;text-anchor:middle}.line{fill:none;stroke:#80e4c2;stroke-width:2.6;marker-end:url(#arr)}.goldline{fill:none;stroke:#f7bd69;stroke-width:2.6;marker-end:url(#gold)}.dash{fill:none;stroke:#64748b;stroke-width:1.3;stroke-dasharray:6 7}</style><rect width="1100" height="470" fill="#0d1828" rx="16"/><text x="30" y="39" class="a">Kerberos 인증 전체 흐름: AS → TGS → AP</text><text x="30" y="62" class="b">정상 신규 인증의 대표 흐름; 캐시된 티켓이 있으면 일부 과정은 생략됩니다</text><rect x="27" y="90" width="214" height="66" rx="11" fill="#1c3044" stroke="#80e4c2" stroke-width="1.6"/><text x="134" y="120" class="head">클라이언트 / PC</text><text x="134" y="142" class="mid">사용자 john</text><rect x="443" y="90" width="214" height="66" rx="11" fill="#1c3044" stroke="#80e4c2" stroke-width="1.6"/><text x="550" y="120" class="head">DC / KDC</text><text x="550" y="142" class="mid">AS + TGS 서비스</text><rect x="859" y="90" width="214" height="66" rx="11" fill="#1c3044" stroke="#80e4c2" stroke-width="1.6"/><text x="966" y="120" class="head">서비스 서버</text><text x="966" y="142" class="mid">cifs/fileserver</text><path d="M134 156 V423" class="dash"/><path d="M550 156 V423" class="dash"/><path d="M966 156 V423" class="dash"/><path class="line" d="M134 202 H548"/><text x="342" y="193" class="mid">① AS-REQ</text><path class="goldline" d="M550 240 H136"/><text x="342" y="231" class="mid">② AS-REP: TGT</text><path class="line" d="M134 284 H548"/><text x="342" y="275" class="mid">③ TGS-REQ (SPN)</text><path class="goldline" d="M550 324 H136"/><text x="342" y="315" class="mid">④ TGS-REP: TGS</text><path class="line" d="M134 369 H964"/><text x="758" y="360" class="mid">⑤ AP-REQ</text><path class="goldline" d="M966 411 H136"/><text x="757" y="402" class="mid">⑥ AP-REP (상호 인증 시)</text><text x="760" y="449" class="note">서비스는 티켓을 확인하고 별도로 리소스 권한을 검사합니다</text></svg>