<svg xmlns="http://www.w3.org/2000/svg" width="440" height="285" viewBox="0 0 440 285" role="img" aria-labelledby="title desc">
  <title id="title">Compare an RA with endpoint state</title><desc id="desc">The host can solicit a router, and the router advertises independently of whether a host applies the settings.</desc>
