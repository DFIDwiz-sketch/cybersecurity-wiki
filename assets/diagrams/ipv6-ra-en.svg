  <g fill="#143550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17">
    <text x="97" y="50" font-weight="bold">Host</text><text x="343" y="50" font-weight="bold">Router</text>
    <text x="220" y="101">RS prompts RA</text><text x="220" y="153">RA supplies options</text>
    <text x="123" y="222" font-weight="bold">Check host state</text><text x="123" y="245" font-size="15">Route · address · DNS</text>
  </g>
