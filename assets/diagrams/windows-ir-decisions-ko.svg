<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">대응 결정: 증거·조치·복구 조건</title><desc id="desc">요청과 완료, 복구 승인을 구분하고 미확인과 담당자를 기록합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">대응 결정: 증거·조치·복구 조건</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. 평가 + 보존</text><text x="14" y="63" font-size="16" fill="#edf4ff">근거 ID + 미확인</text><text x="14" y="89" font-size="16" fill="#edf4ff">호스트 + 신원 범위</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. 차단 요청</text><text x="14" y="63" font-size="16" fill="#edf4ff">담당자 + 의도한 범위</text><text x="14" y="89" font-size="16" fill="#edf4ff">대기 작업 기록</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. 적용 검증</text><text x="14" y="63" font-size="16" fill="#edf4ff">장치의 완료 응답</text><text x="14" y="89" font-size="16" fill="#edf4ff">허용 경로 확인</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. 복구 조건</text><text x="14" y="63" font-size="16" fill="#edf4ff">무결성 + 신원 조치</text><text x="14" y="89" font-size="16" fill="#edf4ff">수집 검증 + 담당 승인</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">06:09 요청 ≠ 06:20 완료 응답입니다. 작업 삭제만으로 사건을 종료하지 마세요.</text></g></svg>
