<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Sysmon: 전체 증거 경로 검증</title><desc id="desc">생성·전달·파싱·분석은 단계별로 검증해야 합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Sysmon: 전체 증거 경로 검증</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. 엔드포인트</text><text x="14" y="63" font-size="16" fill="#edf4ff">빌드 + 유효 정책</text><text x="14" y="89" font-size="16" fill="#edf4ff">로컬 이벤트 + 원본 시각</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. 수집</text><text x="14" y="63" font-size="16" fill="#edf4ff">채널 + 전달</text><text x="14" y="89" font-size="16" fill="#edf4ff">보존 + 전송 상태</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. 파싱</text><text x="14" y="63" font-size="16" fill="#edf4ff">출발 호스트 + 식별자</text><text x="14" y="89" font-size="16" fill="#edf4ff">시각 + 필드 보존</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. 조사</text><text x="14" y="63" font-size="16" fill="#edf4ff">프로세스 인스턴스 + 맥락</text><text x="14" y="89" font-size="16" fill="#edf4ff">관측 / 추론 / 미확인</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">에이전트 설치만으로 수집 범위·전달·분석 결론이 검증되지는 않습니다.</text></g></svg>
