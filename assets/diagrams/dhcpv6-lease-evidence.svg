<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" lang="en" role="img" aria-labelledby="title desc">
  <title id="title">DHCPv6 addresses, delegated prefixes, and options</title>
  <desc id="desc">A client can reach a DHCPv6 server directly or through a relay. Replies serve different purposes. Router discovery is a separate operation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91dfcb"/>
    </marker>
  </defs>
  <rect width="560" height="340" rx="14" fill="#111d30"/>
  <g fill="#1c3047" stroke="#91dfcb" stroke-width="1.5">
    <rect x="109" y="18" width="342" height="45" rx="9"/>
    <rect x="109" y="89" width="342" height="56" rx="9"/>
    <rect x="17" y="183" width="170" height="70" rx="9"/>
    <rect x="195" y="183" width="170" height="70" rx="9"/>
    <rect x="373" y="183" width="170" height="70" rx="9"/>
    <rect x="63" y="282" width="434" height="41" rx="9"/>
  </g>
  <g fill="none" stroke="#91dfcb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M280 63V86"/>
    <path d="M211 145L105 180"/>
    <path d="M280 145V180"/>
    <path d="M349 145L455 180"/>
  </g>
  <g fill="#f2f7fc" text-anchor="middle" font-family="system-ui, sans-serif">
    <g font-size="18" font-weight="700">
      <text x="280" y="46">DHCPv6 client</text>
      <text x="280" y="113">DHCPv6 server</text>
      <text x="102" y="209">IA_NA</text><text x="280" y="209">IA_PD</text><text x="458" y="209">Options only</text>
    </g>
    <g font-size="15">
      <text x="280" y="134">Direct path or via a relay</text>
      <text x="102" y="229">Assigned IPv6 address</text><text x="102" y="247">Exact address evidence</text>
      <text x="280" y="229">Delegated prefix</text><text x="280" y="247">Router binding evidence</text>
      <text x="458" y="229">Information-request</text><text x="458" y="247">No lease in exchange</text>
      <text x="280" y="308">Router Advertisements independently signal default routers.</text>
    </g>
  </g>
</svg>
