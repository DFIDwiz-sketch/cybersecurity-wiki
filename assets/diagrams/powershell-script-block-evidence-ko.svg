<svg xmlns="http://www.w3.org/2000/svg" width="440" height="354" viewBox="0 0 440 354" xml:lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">4104 복원과 실행 결과 확인</title>
  <desc id="desc">순번이 있는 조각을 원본 출처와 블록별로 묶고, 빠진 번호를 확인한 뒤 프로세스 및 결과 증거에 연결합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="440" height="354" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M220 101v19"/>
    <path d="M220 180v20"/>
    <path d="M220 261v20"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="29" font-size="18" font-weight="700">4104 복원과 실행 결과 확인</text>
    <rect x="35" y="44" width="370" height="57" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="220" y="67" font-size="17" font-weight="700">순번이 있는 4104 기록</text>
    <text x="220" y="89" font-size="15">도착 순서는 달라질 수 있음</text>
    <rect x="35" y="123" width="370" height="57" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="220" y="146" font-size="17" font-weight="700">조각을 묶고 검증</text>
    <text x="220" y="168" font-size="15">원본 출처·프로세스·블록 ID</text>
    <rect x="35" y="204" width="370" height="57" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="220" y="227" font-size="17" font-weight="700">번호순으로 복원</text>
    <text x="220" y="249" font-size="15">빠진 번호가 있으면 명시</text>
    <rect x="35" y="285" width="370" height="57" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="220" y="308" font-size="17" font-weight="700">별도 증거로 결과 확인</text>
    <text x="220" y="330" font-size="15">프로세스와 실제 동작 기록</text>
  </g>
</svg>
