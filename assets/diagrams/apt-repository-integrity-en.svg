<svg xmlns="http://www.w3.org/2000/svg" width="400" height="296" viewBox="0 0 400 296" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">APT archive verification</title>
  <desc id="desc">Allow-listed public key verifies Release. Release authenticates the Packages digest. Packages authenticates the Debian package digest.</desc>
  <rect width="400" height="296" rx="14" fill="#10212d"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="200" y="29" fill="#e9f6ff" font-size="19" font-weight="700">APT archive verification</text>
    <rect x="18" y="44" width="364" height="62" rx="9" fill="#173244" stroke="#5296ab"/>
    <text x="200" y="68" fill="#e9f6ff" font-size="19" font-weight="700">Verify Release</text>
    <text x="200" y="91" fill="#c8e0e9" font-size="17">Use the allowed public key</text>
    <rect x="18" y="131" width="364" height="62" rx="9" fill="#173244" stroke="#5296ab"/>
    <text x="200" y="155" fill="#e9f6ff" font-size="19" font-weight="700">Check the Packages index</text>
    <text x="200" y="178" fill="#c8e0e9" font-size="17">Use the SHA-256 from Release</text>
    <rect x="18" y="218" width="364" height="62" rx="9" fill="#173244" stroke="#5296ab"/>
    <text x="200" y="242" fill="#e9f6ff" font-size="19" font-weight="700">Check the downloaded .deb</text>
    <text x="200" y="265" fill="#c8e0e9" font-size="17">Use the SHA-256 from Packages</text>
  </g>
  <path d="M200 110v17m-5-6 5 6 5-6 M200 197v17m-5-6 5 6 5-6" fill="none" stroke="#7de3ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
