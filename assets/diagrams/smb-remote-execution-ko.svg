<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="SMB 원격 명령 실행: SMB + RPC"><style>.bg{fill:#0d172b}.h{fill:#f9fafb;text-anchor:middle;font-weight:700;font-size:17px}.p{fill:#c9d8ef;text-anchor:middle;font-size:13px}.caption{fill:#c9d8ef;font-size:15px;text-anchor:middle}.head{fill:#f8fafc;font-size:24px;font-weight:700}.sub{fill:#a6bddb;font-size:14px}.line{fill:none;stroke:#60a5fa;stroke-width:2.8;stroke-linecap:round}.warn{fill:none;stroke:#fbbf24;stroke-width:2.8}.small{fill:#94a3b8;font-size:13px;text-anchor:middle}.notice{fill:#fde68a;font-size:14px;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60a5fa" stroke-width="1.4"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#fbbf24" stroke-width="1.4"/></marker></defs><rect class="bg" width="960" height="360" rx="16"/><text x="30" y="37" class="head">SMB 원격 명령 실행: SMB + RPC</text><text x="30" y="62" class="sub">화면 접속(RDP)이 아니라 공유 접근과 원격 서비스 관리로 명령 실행</text><rect x="22" y="106" width="203" height="100" rx="13" fill="#1e304e" stroke="#60a5fa" stroke-width="2"/><text x="123.5" y="133" class="h">관리자 PC</text><text x="123.5" y="155" class="p">관리 권한 인증</text><rect x="266" y="106" width="203" height="100" rx="13" fill="#1e304e" stroke="#60a5fa" stroke-width="2"/><text x="367.5" y="133" class="h">SMB 공유</text><text x="367.5" y="155" class="p">TCP 445 / ADMIN$</text><rect x="510" y="106" width="203" height="100" rx="13" fill="#1e304e" stroke="#22c55e" stroke-width="2"/><text x="611.5" y="133" class="h">RPC 서비스 제어</text><text x="611.5" y="155" class="p">SCM / Named Pipe</text><rect x="754" y="106" width="184" height="100" rx="13" fill="#1e304e" stroke="#22c55e" stroke-width="2"/><text x="846" y="133" class="h">대상 서버</text><text x="846" y="155" class="p">명령 실행</text><path class="line" d="M226 156 h37" marker-end="url(#arrow)"/><path class="line" d="M470 156 h37" marker-end="url(#arrow)"/><path class="line" d="M714 156 h37" marker-end="url(#arrow)"/><text x="147" y="246" class="caption">① SMB 파일 복사(필요 시)</text><text x="452" y="246" class="caption">② RPC로 서비스 생성·시작</text><text x="757" y="246" class="caption">③ 결과 수신(구현에 따라)</text><text x="480" y="315" class="notice">원격 관리자 권한 필요 · 서비스 및 SMB 이벤트는 대상 서버에서 확인</text></svg>