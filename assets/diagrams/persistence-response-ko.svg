<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">지속성 대응: 보존·차단·검증</title><desc id="desc">방식과 범위를 확인하고 실행 중 프로세스와 신원을 별도로 처리합니다.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">지속성 대응: 보존·차단·검증</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. 보존 + 범위</text><text x="14" y="63" font-size="16" fill="#edf4ff">호스트 / SID / 객체 경로</text><text x="14" y="89" font-size="16" fill="#edf4ff">정의 + 실행 대상 파일</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. 재구성</text><text x="14" y="63" font-size="16" fill="#edf4ff">수행자 / 변경 / 트리거</text><text x="14" y="89" font-size="16" fill="#edf4ff">실행 + 승인 여부</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. 차단 + 복구</text><text x="14" y="63" font-size="16" fill="#edf4ff">담당자와 변경 범위 조정</text><text x="14" y="89" font-size="16" fill="#edf4ff">프로세스 + 신원 대응</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. 검증</text><text x="14" y="63" font-size="16" fill="#edf4ff">원하는 상태 + 모니터링</text><text x="14" y="89" font-size="16" fill="#edf4ff">재생성 확인</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">등록 하나를 삭제해도 모든 프로세스·다른 접근 경로가 사라지지는 않습니다.</text></g></svg>
