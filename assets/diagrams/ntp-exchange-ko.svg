<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 286" role="img" aria-labelledby="title desc" lang="ko" width="440" height="286">
  <title id="title">NTP 요청과 응답</title>
  <desc id="desc">T1과 T4는 클라이언트 시계, T2와 T3는 서버 시계의 값입니다. 요청은 T1에서 T2로, 응답은 T3에서 T4로 이동합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee7c2"/>
    </marker>
  </defs>
  <rect width="440" height="286" rx="18" fill="#111b27"/>
  <g fill="#edf4fa" font-family="system-ui, sans-serif" font-size="19">
    <text x="24" y="39">클라이언트 시계</text>
    <text x="416" y="39" text-anchor="end">서버 시계</text>
    <text x="24" y="86">T1 · 송신</text>
    <text x="416" y="127" text-anchor="end">T2 · 수신</text>
    <text x="416" y="181" text-anchor="end">T3 · 송신</text>
    <text x="24" y="223">T4 · 수신</text>
  </g>
  <path d="M 152 55 V 250 M 288 55 V 250" stroke="#829bb0" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 152 79 L 288 121 M 288 174 L 152 216" fill="none" stroke="#5ee7c2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g fill="#a3f6e0" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="220" y="84">요청</text>
    <text x="220" y="171">응답</text>
  </g>
</svg>
