<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Separate access from impact</title><desc id="desc">Reachability: Port / path observed: Not proof of rights; Authentication: Identity established: Not resource access; Authorization: Operation permitted: Not proof of use; Operation: Session / file / process: Verify the outcome; Impact: Business consequence: Requires evidence</desc><rect width="1000" height="300" rx="20" fill="#101c2d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="42" font-size="25" font-weight="700" fill="#edf5ff">Separate access from impact</text><rect x="20" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="32" y="109" font-size="18" font-weight="700" fill="#79ddc3">Reachability</text><text x="32" y="146" font-size="16" fill="#eef5ff">Port / path observed</text><text x="32" y="176" font-size="14" fill="#bccfe4">Not proof of rights</text><text x="202" y="146" font-size="16" fill="#79ddc3">→</text><rect x="215" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="227" y="109" font-size="18" font-weight="700" fill="#79ddc3">Authentication</text><text x="227" y="146" font-size="16" fill="#eef5ff">Identity established</text><text x="227" y="176" font-size="14" fill="#bccfe4">Not resource access</text><text x="397" y="146" font-size="16" fill="#79ddc3">→</text><rect x="410" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="422" y="109" font-size="18" font-weight="700" fill="#79ddc3">Authorization</text><text x="422" y="146" font-size="16" fill="#eef5ff">Operation permitted</text><text x="422" y="176" font-size="14" fill="#bccfe4">Not proof of use</text><text x="592" y="146" font-size="16" fill="#79ddc3">→</text><rect x="605" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="617" y="109" font-size="18" font-weight="700" fill="#79ddc3">Operation</text><text x="617" y="146" font-size="16" fill="#eef5ff">Session / file / process</text><text x="617" y="176" font-size="14" fill="#bccfe4">Verify the outcome</text><text x="787" y="146" font-size="16" fill="#79ddc3">→</text><rect x="800" y="75" width="180" height="128" rx="12" fill="#192b43" stroke="#449bdf"/><text x="812" y="109" font-size="18" font-weight="700" fill="#79ddc3">Impact</text><text x="812" y="146" font-size="16" fill="#eef5ff">Business consequence</text><text x="812" y="176" font-size="14" fill="#bccfe4">Requires evidence</text><text x="24" y="252" font-size="20" fill="#dce9f8">Successful logon ≠ successful execution ≠ confirmed compromise</text></g></svg>
