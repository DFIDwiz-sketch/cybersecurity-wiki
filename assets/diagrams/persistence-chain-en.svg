<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Windows persistence: prove each stage</title><desc id="desc">Registration, eligible trigger, execution and subsequent impact require separate evidence.</desc><rect width="1100" height="310" rx="18" fill="#101c2d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="24" fill="#79ddc3">Windows persistence: prove each stage</text><g transform="translate(40,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">1. Registration</text><text x="14" y="63" font-size="16" fill="#edf4ff">Run / task / service / WMI</text><text x="14" y="89" font-size="16" fill="#edf4ff">Current + historical state</text></g><g transform="translate(299,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">2. Trigger</text><text x="14" y="63" font-size="16" fill="#edf4ff">Logon / schedule / event</text><text x="14" y="89" font-size="16" fill="#edf4ff">Conditions + run identity</text></g><g transform="translate(558,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">3. Execution</text><text x="14" y="63" font-size="16" fill="#edf4ff">Process / action evidence</text><text x="14" y="89" font-size="16" fill="#edf4ff">Host + lifetime + context</text></g><g transform="translate(817,72)"><rect width="243" height="152" rx="10" fill="#192b43" stroke="#449bdf"/><text x="14" y="31" font-size="19" fill="#79ddc3">4. Access / impact</text><text x="14" y="63" font-size="16" fill="#edf4ff">Files / network / resources</text><text x="14" y="89" font-size="16" fill="#edf4ff">Confirm a reliable link</text></g><text x="40" y="267" font-size="18" fill="#edf4ff">Configuration present ≠ trigger met ≠ action ran ≠ malicious impact</text></g></svg>
