<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Path MTU discovery after an oversized packet</title>
  <desc id="desc">A sender sends a 1500-byte IP packet toward a router whose next link allows 1400 bytes. A matching ICMP error returns to the sender. A smaller retry passes toward the receiver.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65e4c6"/>
    </marker>
  </defs>
  <rect width="480" height="278" rx="16" fill="#111b27"/>
  <path d="M 48 52 V 248 M 240 52 V 248 M 432 52 V 248" stroke="#8ca8bf" stroke-dasharray="5 5"/>
  <g stroke="#65e4c6" stroke-width="2.5" fill="none">
    <path d="M 48 104 H 238" marker-end="url(#arrow)"/>
    <path d="M 238 158 H 50" marker-end="url(#arrow)"/>
    <path d="M 48 220 H 238" marker-end="url(#arrow)"/>
    <path d="M 240 220 H 430" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <g fill="#f0f6fb" font-weight="650" font-size="18">
      <text x="48" y="33">Sender</text>
      <text x="240" y="33">Bottleneck router</text>
      <text x="432" y="33">Receiver</text>
    </g>
    <g fill="#b9f8e7" font-size="17">
      <text x="144" y="94">1,500 B sent</text>
      <text x="144" y="147">ICMP reports 1,400 B</text>
      <text x="144" y="209">Smaller retry fits</text>
      <text x="336" y="209">1,400 B forwarded</text>
    </g>
    <text x="336" y="105" fill="#fce6b5" font-size="17">Next link 1,400 B</text>
  </g>
</svg>
