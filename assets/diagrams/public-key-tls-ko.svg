<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3: 역할을 나누어 결합</title><desc id="desc">1. 임시 키 공유 → 공유 비밀 재료. 2. 인증서 검증 + 서버 핸드셰이크 서명. 3. 키 파생 + Finished 확인. 4. 대칭 AEAD → 애플리케이션 데이터 보호. 인증서 키 ≠ 임시 키 합의 키. 인증서 기반 전체 핸드셰이크의 개념도: PSK·세부 메시지 생략</desc><rect width="760" height="505" rx="16" fill="#101c30"/><g font-family="Arial, sans-serif" fill="#eaf2ff"><text x="30" y="40" font-size="24">TLS 1.3: 역할을 나누어 결합</text><rect x="30" y="65" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="100" font-size="21">1. 임시 키 공유 → 공유 비밀 재료</text><text x="375" y="144" font-size="23">↓</text><rect x="30" y="150" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="185" font-size="21">2. 인증서 검증 + 서버 핸드셰이크 서명</text><text x="375" y="229" font-size="23">↓</text><rect x="30" y="235" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="270" font-size="21">3. 키 파생 + Finished 확인</text><text x="375" y="314" font-size="23">↓</text><rect x="30" y="320" width="700" height="55" rx="9" fill="#203752"/><text x="45" y="355" font-size="21">4. 대칭 AEAD → 애플리케이션 데이터 보호</text><text x="30" y="440" font-size="20" fill="#71ddd0">인증서 키 ≠ 임시 키 합의 키</text><text x="30" y="475" font-size="16">인증서 기반 전체 핸드셰이크의 개념도: PSK·세부 메시지 생략</text></g></svg>