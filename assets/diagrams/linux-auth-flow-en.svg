<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 358" role="img" aria-labelledby="t d"><title id="t">Investigate Linux Authentication Logs with SSH, PAM and sudo</title><desc id="d">SSH connection · source address. SSH authentication accepted. Session evidence · PAM and host logs. sudo decision · allow or deny. Execution outcome · separate evidence. These are possible observations when a successful SSH session requests sudo.</desc><rect width="430" height="358" rx="14" fill="#15243b"/><g font-family="sans-serif" text-anchor="middle" font-size="17" fill="#f0f7ff"><rect x="18" y="12" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="40">SSH connection · source address</text><text x="215" y="78" fill="#83ebd2">↓</text><rect x="18" y="83" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="111">SSH authentication accepted</text><text x="215" y="149" fill="#83ebd2">↓</text><rect x="18" y="154" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="182">Session evidence · PAM and host logs</text><text x="215" y="220" fill="#83ebd2">↓</text><rect x="18" y="225" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="253">sudo decision · allow or deny</text><text x="215" y="291" fill="#83ebd2">↓</text><rect x="18" y="296" width="394" height="44" rx="8" fill="#274563"/><text x="215" y="324">Execution outcome · separate evidence</text></g></svg>