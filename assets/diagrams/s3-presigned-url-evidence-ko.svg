<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 362" width="560" height="362" lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">사전 서명 GET의 증거</title>
  <desc id="desc">S3는 보유자가 보낸 서명 GET을 검사합니다. 두 S3 로그는 요청 ID로 연결하고 앱 발급 기록은 서명 주체, 범위, 시각을 따로 대조합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#83dbc8"/>
    </marker>
  </defs>
  <rect width="560" height="362" rx="14" fill="#101a29"/>
  <g fill="#172a3c" stroke="#83dbc8" stroke-width="1.5">
    <rect x="20" y="18" width="250" height="68" rx="10"/>
    <rect x="290" y="18" width="250" height="68" rx="10"/>
    <rect x="142" y="114" width="276" height="66" rx="10"/>
    <rect x="20" y="211" width="250" height="62" rx="10"/>
    <rect x="290" y="211" width="250" height="62" rx="10"/>
    <rect x="80" y="300" width="400" height="45" rx="10"/>
  </g>
  <g fill="none" stroke="#83dbc8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M271 52H287"/>
    <path d="M415 86L350 111"/>
    <path d="M220 180L147 208"/>
    <path d="M340 180L413 208"/>
    <path d="M145 273L223 297"/>
    <path d="M415 273L337 297"/>
  </g>
  <path d="M60 86H12V321H77" fill="none" stroke="#83dbc8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <g fill="#f3f7fc" font-family="system-ui, sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="700">
      <text x="145" y="44">애플리케이션</text>
      <text x="415" y="44">링크 보유자</text>
      <text x="280" y="140">S3가 요청을 평가</text>
      <text x="145" y="235">CloudTrail 데이터 이벤트</text>
      <text x="415" y="235">S3 액세스 로그</text>
    </g>
    <g font-size="15">
      <text x="145" y="68">발급과 예정 수신자를 기록</text>
      <text x="415" y="68">서명 GET을 S3에 전송</text>
      <text x="280" y="163">서명, 만료, 권한 검사</text>
      <text x="145" y="257">요청 ID와 서명 세션</text>
      <text x="415" y="257">요청 ID, 상태, 바이트</text>
      <text x="280" y="319">S3 기록은 요청 ID로 연결</text>
      <text x="280" y="337">발급 기록은 서명 주체, 범위, 시각으로 대조</text>
    </g>
  </g>
</svg>
