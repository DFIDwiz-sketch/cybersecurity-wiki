<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Kerberoasting: the complete attack chain"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#93c5fd" stroke-width="1.5"/></marker><marker id="warningArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#fbbf24" stroke-width="1.5"/></marker></defs><rect width="1000" height="330" fill="#101a2e" rx="16"/><text x="32" y="40" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Kerberoasting: the complete attack chain</text><text x="32" y="64" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#a9bdd8">Authenticated access to a TGS request; offline guessing is not visible to the domain controller</text><rect x="24" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="109" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">1. Domain access</text><text x="109" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">Valid user / TGT</text><path d="M196 148 L216 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="219" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="304" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">2. Discover SPNs</text><text x="304" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">Service accounts</text><path d="M391 148 L411 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="414" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#61a9ea" stroke-width="1.6"/><text x="499" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">3. Request TGS</text><text x="499" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">DC issues ticket</text><path d="M586 148 L606 148" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#warningArrow)"/><rect x="609" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#fbbf24" stroke-width="1.6"/><text x="694" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">4. Offline guessing</text><text x="694" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">Test key candidates</text><path d="M781 148 L801 148" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="804" y="105" width="170" height="89" rx="12" fill="#1e2d47" stroke="#fb7185" stroke-width="1.6"/><text x="889" y="139" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="16" fill="#eff6ff">5. Account misuse</text><text x="889" y="166" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="12" fill="#c6d7ec">Only if recovered</text><path d="M106 202 V216 H880" fill="none" stroke="#465a7b" stroke-dasharray="6 5" stroke-width="1.5"/><text x="500" y="240" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="15" fill="#93c5fd">Event 4769 recorded on the DC</text><text x="500" y="263" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="600" font-size="14" fill="#fbbf24">No online logon attempts during offline testing</text><text x="500" y="288" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-weight="400" font-size="13" fill="#c6d7ec">Follow-on logons can create new evidence</text></svg>