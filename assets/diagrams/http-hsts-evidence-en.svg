<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 328" width="420" height="328" role="img" aria-labelledby="title desc">
  <title id="title">HSTS upgrade and server redirect</title><desc id="desc">The browser checks whether HSTS applies. An active policy upgrades the URL before transmission. Without this or another client upgrade, HTTP can reach the server and get a redirect.</desc>
  <rect width="420" height="328" rx="18" fill="#122431"/>
  <g fill="#192f40" stroke="#79e1c2" stroke-width="2">
    <rect x="85" y="20" width="250" height="42" rx="9"/>
    <rect x="85" y="94" width="250" height="42" rx="9"/>
    <rect x="14" y="195" width="188" height="57" rx="9"/>
    <rect x="218" y="195" width="188" height="57" rx="9"/>
    <rect x="85" y="281" width="250" height="35" rx="9"/>
  </g>
  <g fill="none" stroke="#79e1c2" stroke-width="2" stroke-linejoin="round">
    <path d="M210 63v26m-4-4 4 4 4-4M210 137v32H108v21m-4-4 4 4 4-4M210 169h102v21m-4-4 4 4 4-4M108 253v12h102v11m-4-4 4 4 4-4M312 253v12H210"/>
  </g>
  <g fill="#f2f8fc" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17">
    <text x="210" y="47">HTTP URL</text><text x="210" y="121">Active HSTS match?</text>
    <text x="143" y="160">Yes</text><text x="277" y="160">No</text>
    <text x="108" y="218" font-weight="700">Client upgrade</text><text x="312" y="218" font-weight="700">HTTP reaches server</text>
    <text x="108" y="240" font-size="15">Before transmission</text><text x="312" y="240" font-size="15">3xx can redirect</text>
    <text x="210" y="304">HTTPS and TLS validation</text>
  </g>
</svg>
