<svg xmlns="http://www.w3.org/2000/svg" width="440" height="380" viewBox="0 0 440 380" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Endpoint isolation evidence</title>
  <desc id="desc">Request and device ID. Did the product confirm?. Pending or failed. Succeeded. Check reachability. Match path and time. Report scope and gaps.</desc>
