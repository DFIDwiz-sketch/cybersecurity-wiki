<svg xmlns="http://www.w3.org/2000/svg" width="400" height="396" viewBox="0 0 400 396" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Negative DNS cache and recovery</title>
  <desc id="desc">A resolver stores a scoped negative outcome. A hit continues to return it until expiry, when a new upstream query can see changed data.</desc>
  <rect width="400" height="396" rx="16" fill="#eff6ff"/>
  <g font-family="system-ui,sans-serif" fill="#112539">
    <rect x="13" y="14" width="374" height="73" rx="10" fill="#ffffff" stroke="#405b75"/>
    <text x="29" y="42" font-size="21" font-weight="700">1. Resolver queries upstream</text>
    <text x="29" y="69" font-size="18">Receives evidence of absence or failure</text>
    <path d="M200 93v16m-5-5 5 5 5-5" fill="none" stroke="#405b75" stroke-width="2"/>
    <rect x="13" y="115" width="374" height="73" rx="10" fill="#ffffff" stroke="#405b75"/>
    <text x="29" y="143" font-size="21" font-weight="700">2. Resolver caches the result</text>
    <text x="29" y="170" font-size="18">Response kind determines its scope</text>
    <path d="M200 194v16m-5-5 5 5 5-5" fill="none" stroke="#405b75" stroke-width="2"/>
    <rect x="13" y="216" width="374" height="73" rx="10" fill="#ffffff" stroke="#405b75"/>
    <text x="29" y="244" font-size="21" font-weight="700">3. Matching query hits cache</text>
    <text x="29" y="271" font-size="18">Existing result remains until expiry</text>
    <path d="M200 295v16m-5-5 5 5 5-5" fill="none" stroke="#405b75" stroke-width="2"/>
    <rect x="13" y="317" width="374" height="73" rx="10" fill="#dcfce7" stroke="#405b75"/>
    <text x="29" y="345" font-size="21" font-weight="700">4. Entry expires</text>
    <text x="29" y="372" font-size="18">A new query can see the repair</text>
  </g>
</svg>
