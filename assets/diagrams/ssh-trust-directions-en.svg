<svg xmlns="http://www.w3.org/2000/svg" width="440" height="289" viewBox="0 0 440 289" role="img" lang="en" aria-labelledby="title desc">
  <title id="title">SSH authentication in two directions</title>
  <desc id="desc">The server signs with its host key. The client verifies the host against a trusted key. Later the client signs with its user key and the server verifies that user key against account policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#65e4c6"/>
    </marker>
  </defs>
  <rect width="440" height="289" rx="16" fill="#111b27"/>
  <path d="M 111 51 V 264 M 329 51 V 264" stroke="#8fa5b9" stroke-dasharray="4 5"/>
  <path d="M 329 116 H 111" fill="none" stroke="#65e4c6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 111 220 H 329" fill="none" stroke="#65e4c6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <g fill="#eaf4fa" font-size="18" font-weight="650">
      <text x="111" y="33">SSH client</text>
      <text x="329" y="33">SSH server</text>
      <text x="220" y="78">Host authentication</text>
      <text x="220" y="182">User authentication</text>
    </g>
    <g fill="#a5f7e2" font-size="16">
      <text x="220" y="105">Host-key signature</text>
      <text x="220" y="209">User-key signature</text>
    </g>
    <g fill="#c6dbe8" font-size="15">
      <text x="117" y="145">Check trusted host identity</text>
      <text x="325" y="249">Check account policy</text>
    </g>
  </g>
</svg>
