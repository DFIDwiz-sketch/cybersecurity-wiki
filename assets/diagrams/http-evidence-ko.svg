<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-labelledby="title desc"><title id="title">HTTP의 관측 계층</title><desc id="desc">클라이언트 → 프록시 / WAF · 요청 ID → 앱 · 요청 ID / 작업 ID → 워커 · 작업 ID. 앱은 비동기 작업을 워커에 전달할 수 있습니다.</desc><rect width="380" height="300" rx="14" fill="#15243b"/><g text-anchor="middle" fill="#eff6ff" font-family="sans-serif" font-size="19"><rect x="35" y="16" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="43">클라이언트</text><text x="190" y="80" fill="#83ebd2">↕</text><rect x="35" y="88" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="115">프록시 / WAF · 요청 ID</text><text x="190" y="152" fill="#83ebd2">↕</text><rect x="35" y="160" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="187">앱 · 요청 ID / 작업 ID</text><text x="190" y="224" fill="#83ebd2">↓</text><rect x="35" y="232" width="310" height="42" rx="8" fill="#274563"/><text x="190" y="259">워커 · 작업 ID</text></g></svg>