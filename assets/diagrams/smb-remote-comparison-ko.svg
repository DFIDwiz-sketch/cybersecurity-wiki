<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="RDP와 SMB는 서로 다른 원격접속 기술"><style>.bg{fill:#0d172b}.h{fill:#f9fafb;text-anchor:middle;font-weight:700;font-size:17px}.p{fill:#c9d8ef;text-anchor:middle;font-size:13px}.caption{fill:#c9d8ef;font-size:15px;text-anchor:middle}.head{fill:#f8fafc;font-size:24px;font-weight:700}.sub{fill:#a6bddb;font-size:14px}.line{fill:none;stroke:#60a5fa;stroke-width:2.8;stroke-linecap:round}.warn{fill:none;stroke:#fbbf24;stroke-width:2.8}.small{fill:#94a3b8;font-size:13px;text-anchor:middle}.notice{fill:#fde68a;font-size:14px;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#60a5fa" stroke-width="1.4"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#fbbf24" stroke-width="1.4"/></marker></defs><rect class="bg" width="960" height="360" rx="16"/><text x="30" y="37" class="head">RDP와 SMB는 서로 다른 원격접속 기술</text><text x="30" y="62" class="sub">SMB는 원격 화면 연결을 제공하지 않지만 원격 관리의 통신 수단이 될 수 있습니다</text><rect x="25" y="110" width="280" height="117" rx="13" fill="#1e304e" stroke="#60a5fa" stroke-width="2"/><text x="165" y="137" class="h">RDP</text><text x="165" y="159" class="p">TCP 3389</text><text x="165" y="177" class="p">화면 · 키보드 · 마우스</text><rect x="343" y="110" width="280" height="117" rx="13" fill="#1e304e" stroke="#60a5fa" stroke-width="2"/><text x="483" y="137" class="h">SMB 공유</text><text x="483" y="159" class="p">TCP 445</text><text x="483" y="177" class="p">파일 · 공유 · 파이프</text><rect x="661" y="110" width="280" height="117" rx="13" fill="#1e304e" stroke="#22c55e" stroke-width="2"/><text x="801" y="137" class="h">PsExec 방식</text><text x="801" y="159" class="p">SMB + RPC</text><text x="801" y="177" class="p">파일 복사 + 서비스 실행</text><rect x="25" y="268" width="910" height="55" rx="10" fill="#203451"/><text x="480" y="300" class="caption">원격 서버의 4624 Type 3 · 5140/5145 · 7045/4697 · 4688 로그를 시간순으로 연계</text></svg>