<svg xmlns="http://www.w3.org/2000/svg" width="420" height="261" viewBox="0 0 420 261" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">BitLocker recovery evidence</title>
  <desc id="desc">Link the tenant, device, volume and protector. Correlate a read in the backup store, observed recovery on the device, and a confirmed active replacement with a matching backup.</desc>
  <rect x="1" y="1" width="418" height="259" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5Z" fill="#475569"/></marker></defs>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210 59v18H74v19"/><path d="M210 59v37"/><path d="M210 59v18h136v19"/>
    <path d="M74 168v18h55v19"/><path d="M210 168v37"/><path d="M346 168v18h-55v19"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="17" width="360" height="42" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="43" font-size="16" font-weight="700">Tenant, device, volume and protector</text>
    <rect x="10" y="97" width="128" height="71" rx="8" fill="#e0f2fe" stroke="#075985"/>
    <text x="74" y="125" font-size="14" font-weight="700">Read evidence</text>
    <text x="74" y="149" font-size="12">Backup store</text>
    <rect x="146" y="97" width="128" height="71" rx="8" fill="#dcfce7" stroke="#166534"/>
    <text x="210" y="125" font-size="14" font-weight="700">Recovery evidence</text>
    <text x="210" y="149" font-size="12">Endpoint</text>
    <rect x="282" y="97" width="128" height="71" rx="8" fill="#fef3c7" stroke="#92400e"/>
    <text x="346" y="125" font-size="14" font-weight="700">Rotation evidence</text>
    <text x="346" y="149" font-size="12">Endpoint and backup</text>
    <rect x="49" y="206" width="322" height="38" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="210" y="230" font-size="16" font-weight="700">Record confirmed outcomes</text>
  </g>
</svg>
