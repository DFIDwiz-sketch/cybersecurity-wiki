<svg xmlns="http://www.w3.org/2000/svg" width="480" height="278" viewBox="0 0 480 278" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">큰 패킷이 제한에 걸렸을 때의 경로 MTU 발견</title>
  <desc id="desc">송신자가 1500바이트 IP 패킷을 보내지만 라우터의 다음 링크는 1400바이트까지 전달합니다. 해당 흐름의 ICMP 오류가 송신자에게 돌아오면 더 작은 재전송이 수신자에게 전달됩니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65e4c6"/>
    </marker>
  </defs>
  <rect width="480" height="278" rx="16" fill="#111b27"/>
  <path d="M 48 52 V 248 M 240 52 V 248 M 432 52 V 248" stroke="#8ca8bf" stroke-dasharray="5 5"/>
  <g stroke="#65e4c6" stroke-width="2.5" fill="none">
    <path d="M 48 104 H 238" marker-end="url(#arrow)"/>
    <path d="M 238 158 H 50" marker-end="url(#arrow)"/>
    <path d="M 48 220 H 238" marker-end="url(#arrow)"/>
    <path d="M 240 220 H 430" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <g fill="#f0f6fb" font-weight="650" font-size="18">
      <text x="48" y="33">송신자</text>
      <text x="240" y="33">병목 라우터</text>
      <text x="432" y="33">수신자</text>
    </g>
    <g fill="#b9f8e7" font-size="17">
      <text x="144" y="94">1,500 B 전송</text>
      <text x="144" y="147">ICMP로 1,400 B 통보</text>
      <text x="144" y="209">작게 재전송</text>
      <text x="336" y="209">1,400 B 전달</text>
    </g>
    <text x="336" y="105" fill="#fce6b5" font-size="17">다음 링크 1,400 B</text>
  </g>
</svg>
